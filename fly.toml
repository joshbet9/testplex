app = "monstermaze"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  TESTPLEX_PORT = "25566"
  TESTPLEX_DATA_ROOT = "/server"

[processes]
  mm21 = "/usr/local/bin/testplex-entrypoint"

[[mounts]]
  source = "testplex_data_restore"
  destination = "/server"

[[services]]
  protocol = "tcp"
  internal_port = 25566
  processes = ["mm21"]
  auto_stop_machines = "stop"
  auto_start_machines = false
  min_machines_running = 0

  [[services.ports]]
    port = 25566

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "performance-2x"
  processes = ["mm21"]
