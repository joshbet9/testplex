name: Testplex bug report
description: Report a reproducible issue from the Testplex 26.3 tester server.
title: "[Bug] "
labels: ["bug"]
assignees:
  - joshbet9
body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, access tokens, private IP addresses, or personal information.
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Skip / not sure
        - Bacon Brawl
        - Bomb Lobbers
        - Castle Assault
        - Death Tag
        - Dragon Escape
        - Dragons
        - Draw My Thing
        - Evolution
        - Gladiators
        - Heroes of GWEN
        - Hoops
        - Master Builders
        - Micro Battles
        - Milk the Cow
        - Monster Maze (Original)
        - Monster Maze (Speed)
        - Monster Maze (Modern)
        - One in the Quiver
        - Paintball
        - Plexball
        - Runner
        - Sheep Quest
        - SkyWars
        - Snake
        - Snap
        - Sneaky Assassins
        - Speed Builders
        - Spleef
        - Super Sploor
        - Turf Wars
        - Wither Assault
        - Wizards
        - Shared lobby or global
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: Server build or commit
      description: Copy the build ID shown in the lobby/debug menu, if available.
      placeholder: e.g. 93ec7248...
  - type: input
    id: map
    attributes:
      label: Map and mode
      placeholder: Map name, mode, and kit if relevant
  - type: dropdown
    id: phase
    attributes:
      label: When did it happen?
      options:
        - Skip / not sure
        - Lobby or queue
        - Countdown or game start
        - During the game
        - Elimination or respawn
        - Round end or stats
        - Other
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the visible result or error message.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include player/bot count and the actions immediately before the issue.
      placeholder: |
        1. Join ...
        2. Select ...
        3. ...
    validations:
      required: false
  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      options:
        - Skip / not sure
        - Every time
        - Often
        - Once so far
        - Not sure
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video (optional)
      description: Attach media after creating the issue. Hide player names if you do not want them public.
    validations:
      required: false
