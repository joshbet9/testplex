name: Testplex Modern Paper 26.3

on:
  # Feature branches are validated by pull_request. Only the integration branch
  # needs a separate push build, which is also the only branch that auto-deploys.
  push:
    branches:
      - "feat/testplex-modern-26.3-platform"
    paths:
      - "modern-platform/**"
      - ".github/workflows/testplex-modern-build.yml"
      - ".github/workflows/deploy-testplex-modern-hyperv.yml"
      - ".github/testplex-modern-recovery.sh"
      - ".github/testplex-modern-recovery-test.sh"
      - "Dockerfile.fly"
      - "fly.toml"
      - "deploy/**"
      - "scripts/testplex-jar-delta.py"
      - "scripts/test_testplex_jar_delta.py"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "modern-platform/**"
      - ".github/workflows/testplex-modern-build.yml"
      - ".github/workflows/deploy-testplex-modern-hyperv.yml"
      - ".github/testplex-modern-recovery.sh"
      - ".github/testplex-modern-recovery-test.sh"
      - "Dockerfile.fly"
      - "fly.toml"
      - "deploy/**"
      - "scripts/testplex-jar-delta.py"
      - "scripts/test_testplex_jar_delta.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-modern-arcade:
    name: Build and test Paper 26.3 plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test safe JAR delta creation and application
        run: python3 -m unittest scripts.test_testplex_jar_delta scripts.test_testplex_map_archive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            modern-platform/pom.xml
            modern-platform/arcade-games-port/pom.xml

      - name: Set up Node.js 24 for Minecraft 26.3 protocol clients
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned offline Minecraft 26.3 protocol client
        run: npm install --prefix "$RUNNER_TEMP/hoops-protocol-client" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "@wp2508/minecraft-protocol@1.69.6"

      - name: Build and run catalogue tests
        run: mvn --batch-mode --no-transfer-progress -f modern-platform/pom.xml clean verify

      - name: Build shared Arcade mechanics, Snake and Monster Maze modules
        run: mvn --batch-mode --no-transfer-progress -f modern-platform/arcade-games-port/pom.xml clean verify

      - name: Test isolated Fly Monster Maze world provisioning
        run: bash deploy/fly/test-monster-maze-world-provisioning.sh

      - name: Build disposable Hoops Paper 26.3 acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="modern-platform/arcade-games-port/src/test-runtime/hoops-paper-smoke"
          mvn --batch-mode --no-transfer-progress -f "$smoke_dir/pom.xml" clean package

      - name: Run four-client Hoops Paper 26.3 gameplay acceptance
        shell: bash
        run: |
          set -euo pipefail
          bash modern-platform/arcade-games-port/scripts/run-hoops-paper-smoke.sh \
            modern-platform/arcade-games-port/target/ArcadeMechanicsModern.jar \
            modern-platform/arcade-games-port/src/test-runtime/hoops-paper-smoke/target/HoopsPaperSmoke.jar \
            "$RUNNER_TEMP/hoops-paper-smoke" \
            "$RUNNER_TEMP/hoops-protocol-client/node_modules"

      - name: Upload Hoops Paper acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoops-paper-26.3-acceptance-results
          path: |
            ${{ runner.temp }}/hoops-paper-smoke/plugins/HoopsPaperSmoke/results.tsv
            ${{ runner.temp }}/hoops-paper-smoke/server.log
            ${{ runner.temp }}/hoops-paper-smoke/client-bots.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build ephemeral Wizards Paper 26.3 gameplay smoke harness
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="modern-platform/arcade-games-port/src/test-runtime/wizards-paper-smoke"
          mvn --batch-mode --no-transfer-progress -f "$smoke_dir/pom.xml" clean package

      - name: Run three-client Wizards Paper 26.3 gameplay acceptance
        shell: bash
        run: |
          set -euo pipefail
          bash modern-platform/arcade-games-port/scripts/run-wizards-paper-smoke.sh \
            modern-platform/arcade-games-port/target/ArcadeMechanicsModern.jar \
            modern-platform/arcade-games-port/src/test-runtime/wizards-paper-smoke/target/WizardsPaperSmoke.jar \
            "$RUNNER_TEMP/wizards-paper-smoke" \
            "$RUNNER_TEMP/hoops-protocol-client/node_modules"

      - name: Upload Wizards Paper smoke results and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizards-paper-26.3-smoke-results
          path: |
            ${{ runner.temp }}/wizards-paper-smoke/plugins/WizardsPaperSmoke/results.tsv
            ${{ runner.temp }}/wizards-paper-smoke/server.log
            ${{ runner.temp }}/wizards-paper-smoke/client-bots.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package the 20 original Wizards maps for isolated deployment
        shell: bash
        run: |
          set -euo pipefail
          map_root="$RUNNER_TEMP/wizards-paper-smoke/update/maps"
          verify_root="$RUNNER_TEMP/wizards-source-map-verify"
          for folder in "Wizards" "Nano Wizards"; do
            count="$(find "$map_root/$folder" -maxdepth 1 -type f -name "*.zip" | wc -l | tr -d " ")"
            [[ "$count" == "10" ]] || { echo "Expected 10 source archives in $folder; found $count." >&2; exit 1; }
          done
          mkdir -p modern-platform/target "$verify_root"
          tar --sort=name --mtime="UTC 1970-01-01" --owner=0 --group=0 --numeric-owner -cf - -C "$map_root" "Wizards" "Nano Wizards" | gzip -n -6 > modern-platform/target/WizardsSourceMaps.tar.gz
          tar -xzf modern-platform/target/WizardsSourceMaps.tar.gz -C "$verify_root"
          for folder in "Wizards" "Nano Wizards"; do
            count="$(find "$verify_root/$folder" -maxdepth 1 -type f -name "*.zip" | wc -l | tr -d " ")"
            [[ "$count" == "10" ]] || { echo "Packaged source archive count is wrong for $folder: $count." >&2; exit 1; }
          done
          tar -tzf modern-platform/target/WizardsSourceMaps.tar.gz >/dev/null
          sha256sum modern-platform/target/WizardsSourceMaps.tar.gz

      - name: Build Fly production image with pinned game worlds
        shell: bash
        run: docker build --build-arg SOURCE_SHA="$GITHUB_SHA" --tag testplex-modern-fly:ci --file Dockerfile.fly .

      - name: Verify Fly image provisions all seven Monster Maze worlds outside persistent data
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash testplex-modern-fly:ci -ec '
            mkdir -p /tmp/testplex-ci-server/world/playerdata
            echo retained > /tmp/testplex-ci-server/world/playerdata/preserve.dat
            /usr/local/bin/provision-monster-maze-worlds /opt/testplex/MonsterMazeMaps /tmp/testplex-ci-server
            test "$(cat /tmp/testplex-ci-server/.testplex-mm-source-maps)" = "$(cat /opt/testplex/MonsterMazeMaps/.testplex-mm-source-maps)"
            test -L /tmp/testplex-ci-server/mm_void
            test "$(cat /tmp/testplex-ci-server/world/playerdata/preserve.dat)" = retained
          '

      - name: Verify modern plugin metadata and packaged classes
        shell: bash
        run: |
          set -euo pipefail
          jar_file="modern-platform/target/TestplexModernArcade.jar"
          arcade_jar="modern-platform/arcade-games-port/target/ArcadeMechanicsModern.jar"
          test -s "$jar_file"
          test -s "$arcade_jar"
          jar tf "$jar_file" | grep -Fxq "plugin.yml"
          jar tf "$jar_file" | grep -Fxq "au/com/testplex/modern/TestplexModernArcade.class"
          jar tf "$jar_file" | grep -Fxq "au/com/testplex/modern/model/ArcadeCatalog.class"
          unzip -p "$jar_file" plugin.yml | grep -Fxq "api-version: '26.3'"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/snake/SnakeGameManager.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/snake/SnakeRules.class"
          for snake_map in Snake_Pit.zip Snake_Volcanic.zip Snake_WinterBabylon.zip; do
            jar tf "$arcade_jar" | grep -Fxq "source-maps/Snake/$snake_map"
          done
          jar tf "$arcade_jar" | grep -Fxq "plugin.yml"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/ArcadeMechanicsModernPlugin.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/ArcadePortManager.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/wizards/WizardsGameManager.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/wizards/WizardsRules.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/wizards/WizardsSpell.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/wizards/WizardsKit.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/PlexballGame.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/PlexballRules.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/CameraShyGame.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/CameraShyRules.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/CameraShyProgressCatalog.class"
          jar tf "$arcade_jar" | grep -Fxq "me/monstermaze/MonsterMazePlugin.class"
          jar tf "$arcade_jar" | grep -Fxq "me/monstermaze/game/GameManager.class"
          jar tf "$arcade_jar" | grep -Fxq "monster-maze/maps.yml"
          jar tf "$arcade_jar" | grep -Fxq "monster-maze/config.yml"
          ! jar tf "$arcade_jar" | grep -Fxq "monster-maze/plugin.yml"
          ! jar tf "$arcade_jar" | grep -Fxq "me/monstermaze/MonsterMazeStandalonePlugin.class"
          ! jar tf "$arcade_jar" | grep -Fxq "me/monstermaze/game/LobbyListener.class"
          ! jar tf "$arcade_jar" | grep -Fxq "me/monstermaze/world/VoidWorldManager.class"
          unzip -p "$arcade_jar" plugin.yml | grep -Fxq "name: ArcadeMechanicsModern"
          unzip -p "$arcade_jar" plugin.yml | grep -Fxq "api-version: '26.3'"
          unzip -p "$arcade_jar" plugin.yml | grep -Fxq "  - FakePlayerPlugin"
          ! unzip -p "$arcade_jar" plugin.yml | grep -Eq '^  games:'
          jar tf "$arcade_jar" | grep -Fxq "source-maps/Draw My Thing/Draw_Stadium.zip"
          jar tf "$arcade_jar" | grep -Fxq "maps/spleef.zip"
          jar tf "$arcade_jar" | grep -Fxq "maps/dragons.zip"
          jar tf "$arcade_jar" | grep -Fxq "maps/runner.zip"

          arcade_config="$(unzip -p "$arcade_jar" config.yml)"
          enabled_ids="$(awk '/^enabled-games:/{in_list=1;next} in_list && /^[^ ]/{exit} in_list && /^  - /{print $2}' <<< "$arcade_config" | paste -sd, -)"
          [[ "$enabled_ids" == "death-tag,one-in-the-quiver,bomb-lobbers,bacon-brawl,castle-assault,gladiators,micro-battles,milk-the-cow,paintball,plexball,spleef,super-sploor,dragon-escape,dragons,evolution,runner,sheep-quest,turf-wars,camera-shy,monster-maze,snake,draw-my-thing,master-builders,skywars,wither-assault,sneaky-assassins,speed-builders,heroes-of-gwen,hoops-remastered,wizards" ]] || {
            echo "Only the explicitly reviewed acceptance queue may be enabled. Found: [$enabled_ids]" >&2
            exit 1
          }

          # Every enabled game must ship every individual 1.8 Testplex map archive.
          # Super Paintball and Super Spleef are legacy rename folders for the same
          # Paintball and Spleef games, so their maps are included in the same catalogs.
          verify_source_map_folder() {
            local folder="$1"
            local expected_file actual_file
            expected_file="$(mktemp)"
            actual_file="$(mktemp)"
            find "update/maps/$folder" -maxdepth 1 -type f -iname "*.zip" -printf "%f\\n" | LC_ALL=C sort > "$expected_file"
            jar tf "$arcade_jar" | sed -n "s#^source-maps/$folder/##p" | grep -i "\\.zip$" | LC_ALL=C sort > "$actual_file" || true
            if ! diff -u "$expected_file" "$actual_file"; then
              echo "Modern plugin map assets do not exactly match update/maps/$folder." >&2
              rm -f "$expected_file" "$actual_file"
              return 1
            fi
            local count
            count="$(wc -l < "$expected_file" | tr -d " ")"
            echo "Verified $count original map archives: $folder"
            rm -f "$expected_file" "$actual_file"
          }
          # Resolve map folders from the actual enabled-game allow-list. Every enabled
          # game with legacy maps must have an explicit mapping; Plexball, Snap and
          # Master Builders use modern/generated arenas. Wither Assault and Sneaky
          # Assassins are explicitly mechanics-test-only generated arenas with no
          # authentic source map bundle. Super Sploor uses the original Sploor folder.
          IFS=, read -r -a enabled_game_array <<< "$enabled_ids"
          for game_id in "${enabled_game_array[@]}"; do
            case "$game_id" in
              death-tag) map_folders=("Death Tag") ;;
              one-in-the-quiver) map_folders=("One in the Quiver") ;;
              bomb-lobbers) map_folders=("Bomb Lobbers") ;;
              bacon-brawl) map_folders=("Bacon Brawl") ;;
              castle-assault) map_folders=("Castle Assault") ;;
              heroes-of-gwen) map_folders=("Heroes of GWEN") ;;
              hoops-remastered) map_folders=(); echo "Hoops Remastered uses its generated isolated court; no legacy source map archives are required." ;;
              wizards) map_folders=(); echo "Wizards and Nano Wizards source archives are imported and packaged by the dedicated 20-map Paper 26.3 harness." ;;
              gladiators) map_folders=("Gladiators") ;;
              micro-battles) map_folders=("Micro Battle") ;;
              milk-the-cow) map_folders=("Milk the Cow") ;;
              paintball) map_folders=("Paintball" "Super Paintball") ;;
              plexball) map_folders=(); echo "Plexball uses its modern arena; no legacy 1.8 map archive folder exists." ;;
              super-sploor) map_folders=("Sploor") ;;
              dragon-escape) map_folders=("Dragon Escape") ;;
              dragons) map_folders=("Dragons") ;;
              runner) map_folders=("Runner") ;;
              sheep-quest) map_folders=("Sheep Quest") ;;
              turf-wars) map_folders=("Turf Wars") ;;
              camera-shy) map_folders=(); echo "Snap uses its procedural modern maze; no legacy 1.8 map archive folder exists." ;;
              spleef) map_folders=("Speef" "Super Spleef") ;;
              monster-maze|monster-maze-speed|monster-maze-modern) map_folders=(); echo "Monster Maze uses its dedicated bundled source worlds; deployment readiness verifies its embedded Arcade registration." ;;
              snake) map_folders=(); echo "Snake's three original map archives are packaged in ArcadeMechanicsModern.jar." ;;
              draw-my-thing) map_folders=("Draw My Thing") ;;
              master-builders) map_folders=(); echo "Master Builders uses generated isolated build plots; no legacy map archive folder exists." ;;
              skywars) map_folders=("Skywars") ;;
              wither-assault) map_folders=(); echo "Wither Assault uses a generated arena; original Industrial West, Labyrinth and Sky Ruins archives are absent." ;;
              sneaky-assassins) map_folders=(); echo "Sneaky Assassins uses a generated town; original map and NPC patrol-route archives are absent." ;;
              speed-builders) map_folders=("Speed Builders") ;;
              evolution) map_folders=("Evolution") ;;
              *) echo "No legacy map parity policy is defined for enabled game [$game_id]." >&2; exit 1 ;;
            esac
            for map_folder in "${map_folders[@]}"; do
              verify_source_map_folder "$map_folder"
            done
          done
          jar tf "$arcade_jar" | grep -Fxq "maps/bomb-lobbers.zip"
          jar tf "$arcade_jar" | grep -Fxq "maps/bacon-brawl.zip"
          jar tf "$arcade_jar" | grep -Fxq "maps/gladiators.zip"
          jar tf "$arcade_jar" | grep -Fxq "maps/micro-battles.zip"
          jar tf "$arcade_jar" | grep -Fxq "maps/paintball.zip"

          # Guard the deployment path against the real standalone source artifact name.
          deploy_workflow=".github/workflows/deploy-testplex-modern-hyperv.yml"
          grep -Fq 'plugins/MonsterMazeStandalone' "$deploy_workflow"
          grep -Fq 'MonsterMazeStandalone' "$deploy_workflow"
          grep -Fq 'me.monstermaze.MonsterMazePlugin' "$deploy_workflow"
          grep -Fq 'retired-monster-maze-plugins' "$deploy_workflow"
          # Repeated deploys must use a verified delta from the exact installed build.
          grep -Fq 'ChangedModernJars.txt' "$deploy_workflow"
          grep -Fq 'Unchanged plugin JAR; omitting transfer' "$deploy_workflow"
          grep -Fq 'Create verified JAR deltas against the deployed build' "$deploy_workflow"
          grep -Fq 'python3 "$helper" create' "$deploy_workflow"
          grep -Fq 'testplex-jar-delta.py" apply' "$deploy_workflow"
          grep -Fq 'No retained successful build artifact matches deployed SHA' "$deploy_workflow"
          grep -Fq 'JAR delta transfer payload' "$deploy_workflow"
          grep -Fq 'delta_bytes <= 9437184' "$deploy_workflow"
          grep -Fq 'timeout-minutes: 5' "$deploy_workflow"
          grep -Fq 'sha256sum -c SHA256SUMS' "$deploy_workflow"
          grep -Fq 'test_testplex_jar_delta' ".github/workflows/testplex-modern-build.yml"
          if grep -Fq 'ArtifactDownloadUrl.curl' "$deploy_workflow" || grep -Fq 'curl --config ArtifactDownloadUrl.curl' "$deploy_workflow"; then
            echo 'Hyper-V deployment must not download the full plugin artifact on the VM.' >&2
            exit 1
          fi
          if grep -Fq -- '--max-time 2700' "$deploy_workflow"; then
            echo 'Hyper-V deployment must not have an unbounded full-artifact download.' >&2
            exit 1
          fi
          python3 - "$deploy_workflow" <<'PY'
          import sys
          source = open(sys.argv[1], encoding="utf-8").read()
          assert "timeout-minutes: 5" in source, "JAR upload/assembly step must have a five-minute cap"
          assert "delta_bytes <= 9437184" in source, "oversized deltas must fail before server state changes"
          assert "testplex-modern-base-artifact" in source, "must use the exact deployed-build artifact as the delta base"
          assert "sha256sum -c SHA256SUMS" in source, "uploaded delta payload must be checksum verified"
          PY
          grep -Fq 'PE_VERSION="2.14.0"' "$deploy_workflow"
          grep -Fq 'PE_SHA512="18a942cb55f64783a63b28deea2cebbbe782e5d6a1089f6700430e183bfbce0a45398a640ed0dff4361b55190dcf47017f2ca7788f4a5c8c9efad1f549a63fe3"' "$deploy_workflow"
          grep -Fq 'packetevents-spigot-$PE_VERSION.jar' "$deploy_workflow"
          grep -Fq 'PacketEvents.jar' "$deploy_workflow"
          grep -Fq 'for plugin in TestplexModernArcade ArcadeMechanicsModern FakePlayerPlugin packetevents' "$deploy_workflow"
          grep -Fq 'need_wizards_maps' "$deploy_workflow"
          grep -Fq 'need_mm_maps' "$deploy_workflow"
          grep -Fq 'Insufficient deployment staging space:' "$deploy_workflow"
          grep -Fq 'tmp_required_kb' "$deploy_workflow"
          grep -Fq "failure() && steps.install-and-start.outcome != 'skipped'" "$deploy_workflow"
          echo "The game suite is delivered by the shared Arcade plugin; Snake and Monster Maze are in-process Arcade modules. No standalone SnakeModern or WizardsModern game plugins are packaged."

      - name: Validate independent deployment recovery and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 .github/testplex-modern-recovery.sh
          bash -n .github/testplex-modern-recovery.sh
          sh -n deploy/fly/verify-runtime.sh
          fixture_root="$(mktemp -d)"
          trap 'rm -rf "$fixture_root"' EXIT
          mkdir -p "$fixture_root/opt/testplex" "$fixture_root/server/update/maps/Wizards" "$fixture_root/server/update/maps/Nano Wizards" "$fixture_root/server/logs"
          for world in mm_void mm_volcano mm_colombia mm_sandycoast mm_siberian mm_swampland mm_tesorohundido; do
            ln -s "/source/$world" "$fixture_root/server/$world"
          done
          printf '%s\n' '0123456789abcdef0123456789abcdef01234567' > "$fixture_root/opt/testplex/source-build.txt"
          printf '%s\n' '[ArcadeMechanicsModern] TESTPLEX_ARCADE_BOOTSTRAP phase=full-runtime-readiness-published' > "$fixture_root/server/logs/latest.log"
          output="$(TESTPLEX_VERIFY_ROOT="$fixture_root" sh deploy/fly/verify-runtime.sh '0123456789abcdef0123456789abcdef01234567')"
          grep -Fx 'TESTPLEX_FLY_RUNTIME_VERIFIED:0123456789abcdef0123456789abcdef01234567' <<< "$output"
          if TESTPLEX_VERIFY_ROOT="$fixture_root" sh deploy/fly/verify-runtime.sh 'fedcba9876543210fedcba9876543210fedcba98'; then
            echo 'Fly runtime verifier accepted a mismatched source SHA.' >&2
            exit 1
          fi
          : > "$fixture_root/server/logs/latest.log"
          if TESTPLEX_VERIFY_ROOT="$fixture_root" TESTPLEX_VERIFY_BOOTSTRAP_ATTEMPTS=1 sh deploy/fly/verify-runtime.sh '0123456789abcdef0123456789abcdef01234567'; then
            echo 'Fly runtime verifier accepted a missing Arcade bootstrap marker.' >&2
            exit 1
          fi
          bash -n .github/testplex-modern-recovery-test.sh
          bash .github/testplex-modern-recovery-test.sh

          # Parse the actual remote deployment transaction shell without running it.
          deploy_workflow=".github/workflows/deploy-testplex-modern-hyperv.yml"
          awk "/<<'REMOTE_DEPLOY'/ { active=1; next } active && /^REMOTE_DEPLOY$/ { exit } active { print }" \
            "$deploy_workflow" > "$RUNNER_TEMP/testplex-modern-remote-deploy.sh"
          test -s "$RUNNER_TEMP/testplex-modern-remote-deploy.sh"
          bash -n "$RUNNER_TEMP/testplex-modern-remote-deploy.sh"
          grep -Fq 'FPP_VERSION="2.1.7"' "$deploy_workflow"
          grep -Fq 'versions/$FPP_VERSION/PAPER/fake-player-plugin-$FPP_VERSION.jar' "$deploy_workflow"
          git diff --check

      - name: Upload modern plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: testplex-modern-paper-26.3
          path: |
            modern-platform/target/TestplexModernArcade.jar
            modern-platform/arcade-games-port/target/ArcadeMechanicsModern.jar
            modern-platform/target/WizardsSourceMaps.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Testplex Modern Paper 26.3"
            echo
            echo "- Runtime/API baseline: Java 25 / Paper 26.3"
            echo "- Separate from legacy Java 8 build and deployment"
            echo "- Catalogue: 30 Arcade selectable IDs (30 READY_FOR_TEST, 0 MECHANICS_IN_PROGRESS), all enabled across 30 distinct titles"
            echo "- Built artifacts: TestplexModernArcade.jar and ArcadeMechanicsModern.jar; all games run through the shared Arcade plugin (including Snake, Wizards and Monster Maze)"
            echo "- Monster Maze port baseline: the 1.21 source implementation, compiled against Paper 26.3"
            echo "- Monster Maze modern UI: first-pad ding, floating +2/+1/-2 heart feedback, per-player kit icons and ability values, Slowballer Cryo Blitz seconds/READY display"
            echo "- Gameplay ports: 30 selections enabled across 30 distinct games, including Evolution, Heroes of Gwen Arcade, Hoops Remastered and Wizards Arcade"
            echo "- Playable allow-list: Death Tag, One in the Quiver, Bomb Lobbers, Bacon Brawl, Castle Assault, Gladiators, Micro Battles, Milk the Cow, Paintball, Plexball, Spleef, Super Sploor, Dragon Escape, Dragons, Evolution, Runner, Sheep Quest, Turf Wars, Snap, Monster Maze, Snake, Draw My Thing, Master Builders, SkyWars Mixed, Wither Assault, Sneaky Assassins, Speed Builders, Heroes of Gwen, Hoops Remastered and Wizards"
            echo "- Deployment: successful pushes to feat/testplex-modern-26.3-platform automatically deploy through the isolated modern Hyper-V workflow"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-modern-test-server:
    name: Deploy successful integration build to isolated Paper 26.3 VM
    # The workflow trigger already filters pushes by modern-platform/workflow paths. Do not re-check head_commit file lists here: merge-push payloads can omit those arrays.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/testplex-modern-26.3-platform' }}
    needs: build-modern-arcade
    uses: ./.github/workflows/deploy-testplex-modern-hyperv.yml
    with:
      deploy_to_modern_test_server: true
      source_run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit

  deploy-modern-fly:
    name: Deploy the verified integration build to Fly production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/testplex-modern-26.3-platform' }}
    needs:
      - build-modern-arcade
      - deploy-modern-test-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: monstermaze
    steps:
      - name: Check out the exact Hyper-V build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the exact tested Paper 26.3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: testplex-modern-paper-26.3
          path: modern-platform

      - name: Set up pinned flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be
        with:
          version: 0.5.5

      - name: Verify the existing production volume before deploy
        id: volume-before
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FLY_API_TOKEN" ]] || { echo "FLY_API_TOKEN is not configured." >&2; exit 1; }
          flyctl volumes list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-volumes-before.json"
          flyctl machine list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-machines-before.json"
          volume_id="$(jq -er '[.[] | select(.name == "testplex_data_restore")] | if length == 1 then .[0].id else error("expected exactly one existing Testplex data volume") end' "$RUNNER_TEMP/fly-volumes-before.json")"
          machine_id="$(jq -er --arg volume "$volume_id" '[.[] | select(any(.config.mounts[]?; .path == "/server" and .volume == $volume))] | if length == 1 then .[0].id else error("expected exactly one existing Testplex machine with the preserved /server volume") end' "$RUNNER_TEMP/fly-machines-before.json")"
          attached_volume="$(jq -er --arg id "$machine_id" '[.[] | select(.id == $id)][0].config.mounts[] | select(.path == "/server") | .volume' "$RUNNER_TEMP/fly-machines-before.json")"
          [[ "$attached_volume" == "$volume_id" ]] || { echo "The existing /server volume is not attached to the Testplex machine; refusing deployment." >&2; exit 1; }
          printf 'id=%s\n' "$volume_id" >> "$GITHUB_OUTPUT"
          printf 'machine_id=%s\n' "$machine_id" >> "$GITHUB_OUTPUT"
          echo "Verified existing persistent volume $volume_id is attached at /server."

      - name: Deploy the exact tested build to Fly without creating a spare VM
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy \
            --app "$FLY_APP" \
            --config fly.toml \
            --dockerfile Dockerfile.fly \
            --remote-only \
            --build-arg "SOURCE_SHA=$GITHUB_SHA" \
            --ha=false \
            --strategy immediate \
            --yes

      - name: Verify the production image, persistent data volume and runtime readiness
        shell: bash
        env:
          EXPECTED_VOLUME_ID: ${{ steps.volume-before.outputs.id }}
          EXPECTED_MACHINE_ID: ${{ steps.volume-before.outputs.machine_id }}
        run: |
          set -euo pipefail
          flyctl volumes list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-volumes-after.json"
          actual_volume_id="$(jq -er '[.[] | select(.name == "testplex_data_restore")] | if length == 1 then .[0].id else error("expected exactly one Testplex data volume after deploy") end' "$RUNNER_TEMP/fly-volumes-after.json")"
          [[ "$actual_volume_id" == "$EXPECTED_VOLUME_ID" ]] || { echo "Fly persistent volume changed from $EXPECTED_VOLUME_ID to $actual_volume_id; investigate before accepting release." >&2; exit 1; }

          flyctl machine list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-machines-after.json"
          machine_id="$(jq -er --arg volume "$EXPECTED_VOLUME_ID" '[.[] | select(any(.config.mounts[]?; .path == "/server" and .volume == $volume))] | if length == 1 then .[0].id else error("expected exactly one deployed Testplex machine with the preserved /server volume") end' "$RUNNER_TEMP/fly-machines-after.json")"
          [[ "$machine_id" == "$EXPECTED_MACHINE_ID" ]] || { echo "Fly deployment selected a different machine than the existing volume owner; refusing to continue." >&2; exit 1; }
          attached_volume="$(jq -er --arg id "$machine_id" '[.[] | select(.id == $id)][0].config.mounts[] | select(.path == "/server") | .volume' "$RUNNER_TEMP/fly-machines-after.json")"
          [[ "$attached_volume" == "$EXPECTED_VOLUME_ID" ]] || { echo "The original persistent volume is not mounted by the deployed machine." >&2; exit 1; }
          # Wait for Fly to finish promoting the replacement before issuing another
          # Machine update. A deploy can return while the previous image is still replacing.
          replacement_ready=false
          for attempt in $(seq 1 36); do
            flyctl machine list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-machines-after.json"
            if jq -e --arg id "$machine_id" --arg sha "$GITHUB_SHA" --arg volume "$EXPECTED_VOLUME_ID" '
              [.[] | select(.id == $id)] as $m |
              ($m | length) == 1 and
              $m[0].host_status == "ok" and
              ($m[0].state == "stopped" or $m[0].state == "started") and
              $m[0].image_ref.labels["org.opencontainers.image.revision"] == $sha and
              any($m[0].config.mounts[]?; .path == "/server" and (.volume == $volume or .volume_id == $volume))
            ' "$RUNNER_TEMP/fly-machines-after.json" >/dev/null; then
              replacement_ready=true
              break
            fi
            sleep 5
          done
          if [[ "$replacement_ready" != true ]]; then
            echo "Fly did not finish promoting the expected image on the original volume-owning Machine." >&2
            cat "$RUNNER_TEMP/fly-machines-after.json" >&2
            flyctl machine status "$machine_id" --app "$FLY_APP" || true
            flyctl logs --app "$FLY_APP" --machine "$machine_id" --no-tail || true
            exit 1
          fi

          # flyctl deploy applies the checked-in fly.toml again, which can
          # restore auto-stop=stop even though it was disabled before deployment.
          # Disable it again after image promotion, then wake the original
          # volume-owning Machine if the deploy caused it to stop before the
          # in-guest runtime verifier can connect.
          if [[ "$restore_autostop" != off ]]; then
            autostop_restore_needed=true
            fly_machine_update_autostop off
          fi
          flyctl machine list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-machines-after-autostop.json"
          post_deploy_state="$(jq -er --arg id "$machine_id" '[.[] | select(.id == $id)][0].state' "$RUNNER_TEMP/fly-machines-after-autostop.json")"
          if [[ "$post_deploy_state" == stopped || "$post_deploy_state" == suspended ]]; then
            echo "Waking the verified Fly release after disabling deployment auto-stop."
            flyctl machine start "$machine_id" --app "$FLY_APP"
          elif [[ "$post_deploy_state" != started ]]; then
            echo "Fly Machine entered unexpected state [$post_deploy_state] after disabling auto-stop." >&2
            cat "$RUNNER_TEMP/fly-machines-after-autostop.json" >&2
            exit 1
          fi

          # The checked-in app config is authoritative. The previous failed attempt
          # may have left the Machine's temporary autostop setting at off.
          restore_autostop="$(awk -F '"' '/^[[:space:]]*auto_stop_machines[[:space:]]*=/{print $2; exit}' fly.toml)"
          case "$restore_autostop" in
            true|stop) restore_autostop=stop ;;
            suspend) restore_autostop=suspend ;;
            false|off) restore_autostop=off ;;
            *) echo "Could not read the intended auto_stop_machines policy from fly.toml." >&2; exit 1 ;;
          esac
          fly_machine_update_autostop() {
            local policy="$1"
            local attempt output
            for attempt in $(seq 1 12); do
              if output="$(flyctl machine update "$machine_id" --app "$FLY_APP" --autostop="$policy" --yes --wait-timeout 300 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              printf '%s\n' "$output" >&2
              if ! grep -Eiq 'machine is replacing|concurrent update in progress' <<< "$output"; then
                echo "Fly rejected an autostop update for a reason that is not a transient replacement lock." >&2
                return 1
              fi
              if [[ "$attempt" -lt 12 ]]; then
                echo "Fly is still replacing the existing Machine; retrying autostop update in five seconds ($attempt/12)." >&2
                sleep 5
              fi
            done
            echo "Fly replacement lock did not clear within one minute; refusing to claim runtime verification." >&2
            return 1
          }
          autostop_restore_needed=false
          restore_fly_autostop() {
            if [[ "$autostop_restore_needed" == true ]]; then
              echo "Restoring Fly autostop policy [$restore_autostop] from fly.toml."
              fly_machine_update_autostop "$restore_autostop"
              autostop_restore_needed=false
            fi
          }
          restore_on_exit() {
            exit_status=$?
            trap - EXIT
            if ! restore_fly_autostop; then
              echo "Could not restore the configured Fly autostop policy; manual recovery is required." >&2
              exit_status=1
            fi
            exit "$exit_status"
          }
          trap restore_on_exit EXIT

          # Disable autostop before waking a stopped machine; otherwise Fly can
          # stop it again between the start request and runtime verification.
          if [[ "$restore_autostop" != off ]]; then
            autostop_restore_needed=true
            fly_machine_update_autostop off
          fi
          flyctl machine list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-machines-after.json"
          state="$(jq -er --arg id "$machine_id" '[.[] | select(.id == $id)][0].state' "$RUNNER_TEMP/fly-machines-after.json")"
          if [[ "$state" == "stopped" || "$state" == "suspended" ]]; then
            flyctl machine start "$machine_id" --app "$FLY_APP"
          elif [[ "$state" != "started" ]]; then
            echo "Cannot start Fly Machine from unexpected state [$state]." >&2
            exit 1
          fi

          ready=false
          for attempt in $(seq 1 30); do
            flyctl machine list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-machines-after.json"
            if jq -e --arg id "$machine_id" --arg sha "$GITHUB_SHA" '
              [.[] | select(.id == $id)] as $m |
              ($m | length) == 1 and
              $m[0].state == "started" and
              $m[0].host_status == "ok" and
              $m[0].image_ref.labels["org.opencontainers.image.revision"] == $sha and
              any($m[0].checks[]?; .status == "passing")
            ' "$RUNNER_TEMP/fly-machines-after.json" >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            echo "Fly machine did not become healthy on the expected release SHA $GITHUB_SHA." >&2
            cat "$RUNNER_TEMP/fly-machines-after.json" >&2
            flyctl machine status "$machine_id" --app "$FLY_APP" || true
            flyctl logs --app "$FLY_APP" --machine "$machine_id" --no-tail || true
            exit 1
          fi

          remote_command="/usr/local/bin/testplex-verify-runtime $GITHUB_SHA"
          flyctl ssh console --app "$FLY_APP" --machine "$machine_id" --command "$remote_command" \
            | tee "$RUNNER_TEMP/fly-runtime-verification.log"
          grep -Fx "TESTPLEX_FLY_RUNTIME_VERIFIED:$GITHUB_SHA" "$RUNNER_TEMP/fly-runtime-verification.log"
          # The in-guest verifier above has already checked Paper's persistent
          # startup log for phase=full-runtime-readiness-published. Fly's recent
          # log stream may omit that line, so it is not an authoritative gate.
          flyctl volumes list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-volumes-final.json"
          final_volume_id="$(jq -er '[.[] | select(.name == "testplex_data_restore")] | if length == 1 then .[0].id else error("Testplex data volume missing after runtime verification") end' "$RUNNER_TEMP/fly-volumes-final.json")"
          [[ "$final_volume_id" == "$EXPECTED_VOLUME_ID" ]]
          if restore_fly_autostop; then
            echo "FLY_AUTOSTOP_RESTORED:$restore_autostop"
          else
            echo "Fly autostop restore returned failure; the exit trap will retry." >&2
            exit 1
          fi

          # Restoring an idle-stop policy may stop the already-verified Machine
          # immediately. Runtime readiness and the startup marker were checked
          # immediately before restoration; final verification now checks that
          # the same image, volume attachment, and original autostop policy remain.
          final_snapshot_verified=false
          for attempt in $(seq 1 12); do
            echo "Refreshing Fly final-state snapshot ($attempt/12)."
            if flyctl machine list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-machines-final.json" &&
              flyctl volumes list --app "$FLY_APP" --json > "$RUNNER_TEMP/fly-volumes-final.json"; then
              final_volume_id="$(jq -er '[.[] | select(.name == "testplex_data_restore")] | if length == 1 then .[0].id else error("Testplex data volume missing after runtime verification") end' "$RUNNER_TEMP/fly-volumes-final.json")" || final_volume_id=""
              if [[ "$final_volume_id" == "$EXPECTED_VOLUME_ID" ]] &&
                jq -e --arg id "$machine_id" --arg sha "$GITHUB_SHA" --arg policy "$restore_autostop" --arg volume "$final_volume_id" '
                  [.[] | select(.id == $id)] as $m |
                  ($m | length) == 1 and
                  ($m[0].state == "started" or
                    ($policy == "stop" and ($m[0].state == "stopped" or $m[0].state == "stopping")) or
                    ($policy == "suspend" and ($m[0].state == "suspended" or $m[0].state == "suspending"))) and
                  $m[0].image_ref.labels["org.opencontainers.image.revision"] == $sha and
                  any($m[0].config.mounts[]?; .volume == $volume or .volume_id == $volume) and
                  ([$m[0].config.services[] | .autostop | tostring] | all(. == $policy or ($policy == "stop" and . == "true"))) and
                  ($m[0].state != "started" or ($m[0].host_status == "ok" and any($m[0].checks[]?; .status == "passing")))
                ' "$RUNNER_TEMP/fly-machines-final.json" >/dev/null; then
                final_snapshot_verified=true
                break
              fi
              echo "Fly snapshot was readable but did not yet match the expected image, volume, health and autostop policy." >&2
            else
              echo "Fly returned a transient error while refreshing its final machine/volume snapshot." >&2
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done
          if [[ "$final_snapshot_verified" != true ]]; then
            echo "Fly final-state verification did not succeed after runtime readiness and autostop restoration." >&2
            [[ -f "$RUNNER_TEMP/fly-machines-final.json" ]] && jq --arg id "$machine_id" '[.[] | select(.id == $id)] | map({id,state,host_status,image_ref,config:{mounts:.config.mounts,services:.config.services}})' "$RUNNER_TEMP/fly-machines-final.json" >&2 || true
            [[ -f "$RUNNER_TEMP/fly-volumes-final.json" ]] && cat "$RUNNER_TEMP/fly-volumes-final.json" >&2 || true
            flyctl machine status "$machine_id" --app "$FLY_APP" >&2 || true
            exit 1
          fi
          echo "FLY_FINAL_STATE_VERIFIED:$GITHUB_SHA"
          echo "Fly release $GITHUB_SHA passed runtime readiness and final-state verification; machine is $(jq -er --arg id "$machine_id" '[.[] | select(.id == $id)][0].state' "$RUNNER_TEMP/fly-machines-final.json") with preserved volume $final_volume_id and restored autostop policy $restore_autostop."


