name: Testplex Modern Paper 26.3

on:
  push:
    branches:
      - "**"
    paths:
      - "modern-platform/**"
      - ".github/workflows/testplex-modern-build.yml"
      - ".github/workflows/deploy-testplex-modern-hyperv.yml"
  pull_request:
    paths:
      - "modern-platform/**"
      - ".github/workflows/testplex-modern-build.yml"
      - ".github/workflows/deploy-testplex-modern-hyperv.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-modern-arcade:
    name: Build and test Paper 26.3 plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            modern-platform/pom.xml
            modern-platform/snake-port/pom.xml
            modern-platform/arcade-games-port/pom.xml

      - name: Build and run catalogue tests
        run: mvn --batch-mode --no-transfer-progress -f modern-platform/pom.xml clean verify

      - name: Build Snake 26.3 port and run mechanics-rule tests
        run: mvn --batch-mode --no-transfer-progress -f modern-platform/snake-port/pom.xml clean verify

      - name: Build Arcade mechanics and the integrated Monster Maze module
        run: mvn --batch-mode --no-transfer-progress -f modern-platform/arcade-games-port/pom.xml clean verify

      - name: Verify modern plugin metadata and packaged classes
        shell: bash
        run: |
          set -euo pipefail
          jar_file="modern-platform/target/TestplexModernArcade.jar"
          snake_jar="modern-platform/snake-port/target/SnakeModern.jar"
          arcade_jar="modern-platform/arcade-games-port/target/ArcadeMechanicsModern.jar"
          test -s "$jar_file"
          test -s "$snake_jar"
          test -s "$arcade_jar"
          jar tf "$jar_file" | grep -Fxq "plugin.yml"
          jar tf "$jar_file" | grep -Fxq "au/com/testplex/modern/TestplexModernArcade.class"
          jar tf "$jar_file" | grep -Fxq "au/com/testplex/modern/model/ArcadeCatalog.class"
          unzip -p "$jar_file" plugin.yml | grep -Fxq "api-version: '26.3'"
          jar tf "$snake_jar" | grep -Fxq "plugin.yml"
          jar tf "$snake_jar" | grep -Fxq "au/com/testplex/snake/SnakeModernPlugin.class"
          jar tf "$snake_jar" | grep -Fxq "au/com/testplex/snake/SnakeRules.class"
          unzip -p "$snake_jar" plugin.yml | grep -Fxq "name: SnakeModern"
          unzip -p "$snake_jar" plugin.yml | grep -Fxq "api-version: '26.3'"
          jar tf "$arcade_jar" | grep -Fxq "plugin.yml"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/ArcadeMechanicsModernPlugin.class"
          jar tf "$arcade_jar" | grep -Fxq "au/com/testplex/arcadeports/ArcadePortManager.class"
          jar tf "$arcade_jar" | grep -Fxq "me/monstermaze/MonsterMazePlugin.class"
          jar tf "$arcade_jar" | grep -Fxq "me/monstermaze/game/GameManager.class"
          jar tf "$arcade_jar" | grep -Fxq "monster-maze/maps.yml"
          jar tf "$arcade_jar" | grep -Fxq "monster-maze/config.yml"
          ! jar tf "$arcade_jar" | grep -Fxq "monster-maze/plugin.yml"
          ! jar tf "$arcade_jar" | grep -Fxq "me/monstermaze/MonsterMazeStandalonePlugin.class"
          unzip -p "$arcade_jar" plugin.yml | grep -Fxq "name: ArcadeMechanicsModern"
          unzip -p "$arcade_jar" plugin.yml | grep -Fxq "api-version: '26.3'"
          jar tf "$arcade_jar" | grep -Fxq "source-maps/Draw My Thing/Draw_Stadium.zip"
          arcade_config="$(unzip -p "$arcade_jar" config.yml)"
          for candidate in bacon-brawl bomb-lobbers dragon-escape dragons gladiators paintball runner spleef draw-my-thing master-builders; do
            grep -Fxq "  - $candidate" <<< "$arcade_config"
          done
          ! grep -Eq "^  - (death-tag|evolution|micro-battles|one-in-the-quiver|sheep-quest|turf-wars)$" <<< "$arcade_config"
          echo "All three modern Paper 26.3 Bukkit plugins verified; Draw My Thing includes its no-resource-pack Stadium map, and all ten enabled Arcade candidates are present."

      - name: Upload modern plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: testplex-modern-paper-26.3
          path: |
            modern-platform/target/TestplexModernArcade.jar
            modern-platform/snake-port/target/SnakeModern.jar
            modern-platform/arcade-games-port/target/ArcadeMechanicsModern.jar
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Testplex Modern Paper 26.3"
            echo
            echo "- Runtime/API baseline: Java 25 / Paper 26.3"
            echo "- Separate from legacy Java 8 build and deployment"
            echo "- Catalogue: 18 Arcade games"
            echo "- Built artifacts: TestplexModernArcade.jar, SnakeModern.jar and ArcadeMechanicsModern.jar (Monster Maze is compiled into the Testplex-owned Arcade module)"
            echo "- Monster Maze port baseline: the 1.21 source implementation, compiled against Paper 26.3"
            echo "- Monster Maze modern UI: first-pad ding, floating +2/+1/-2 heart feedback, per-player kit icons and ability values, Slowballer Cryo Blitz seconds/READY display"
            echo "- Gameplay ports: Monster Maze and Snake plus 16 mechanics-first prototypes, including Draw My Thing and Master Builders; in-game validation still required"
            echo "- Deployment acceptance: eight Arcade candidates remain explicitly approved for acceptance; Draw My Thing and Master Builders are added as gameplay-in-progress test variants; Snake remains gated"
            echo "- Server deploy: a separate workflow-run handler deploys only the latest successful push artifact from feat/testplex-modern-26.3-platform; later source pushes no longer cancel an in-flight VM deployment"
          } >> "$GITHUB_STEP_SUMMARY"

