name: Testplex Java 8 build

on:
  push:
    branches:
      - "**"
    paths:
      - "Plugins/**"
      - ".github/workflows/testplex-build.yml"
      - ".github/scripts/deploy-testplex-hyperv.sh"
      - ".github/scripts/create-testplex-map-bundle.py"
  pull_request:
    paths:
      - "Plugins/**"
      - ".github/workflows/testplex-build.yml"
      - ".github/scripts/deploy-testplex-hyperv.sh"
      - ".github/scripts/create-testplex-map-bundle.py"
  workflow_dispatch:
    inputs:
      deploy_to_test_server:
        description: Deploy this successful build to the isolated Reborn test server on Hyper-V
        required: false
        type: boolean
        default: false
      source_run_id:
        description: Successful build run ID to reuse; leave blank to build this branch including its map archive bundle.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: testplex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mineplex Reborn modules
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_run_id == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: Plugins/pom.xml

      - name: Verify bundled legacy server dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s libs/spigot-1.8.8-1.9-SNAPSHOT.jar
          test -s libs/bungeecord-bootstrap-1.8-SNAPSHOT.jar
          grep -Fq '${mineplex.libs.dir}/spigot-1.8.8-1.9-SNAPSHOT.jar' Plugins/pom.xml
          grep -Fq '${mineplex.libs.dir}/bungeecord-bootstrap-1.8-SNAPSHOT.jar' Plugins/pom.xml

      - name: Build and install all Maven modules
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -f Plugins/pom.xml \
            -Dmineplex.libs.dir="${GITHUB_WORKSPACE}/libs" \
            -DskipTests \
            install

      - name: Verify Arcade artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "Built artifacts:"
          find Plugins/out -maxdepth 1 -type f -name '*.jar' -printf '%f %s bytes\n' | sort
          test -s Plugins/out/Arcade.jar
          python3 -m py_compile .github/scripts/create-testplex-map-bundle.py
      - name: Verify isolated test lobby bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          manager="Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade/ArcadeManager.java"
          builder="Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade/managers/lobby/legacy/TestLobbyPlaneBuilder.java"
          grep -Fq 'isTestplexSandbox()' "$manager"
          grep -Fq 'TESTPLEX ISOLATED TEST SERVER - NOT PRODUCTION' "$manager"
          grep -Fq 'TestLobbyPlaneBuilder.ensure(Bukkit.getWorld("world"))' "$manager"
          grep -Fq 'world/TEST_LOBBY_PLANE.dat' "$builder"
          grep -Fq 'TESTPLEX_SANDBOX_LOBBY_V3' "$builder"
          grep -Fq 'chunk.getSections()' "$builder"
          grep -Fq 'Arrays.fill(chunk.heightMap, 0)' "$builder"
          grep -Fq 'chunk.e();' "$builder"
          grep -Fq 'ARTIFACT_CACHE="/var/tmp/testplex-artifact-cache"' .github/scripts/deploy-testplex-hyperv.sh
          grep -Fq -- '--checksum --partial' .github/workflows/testplex-build.yml
          grep -Fq 'Material.CHEST' Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade/managers/GameHostManager.java
          grep -Fq 'Manager.isTestplexSandbox()' Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade/managers/GameHostManager.java
          grep -Fq 'getPlugin().isTestplexSandbox()' Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade/gui/privateServer/page/SetGamePage.java
          grep -Fq 'if (!_manager.isTestplexSandbox())' Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade/managers/lobby/LobbyManager.java
          grep -Fq 'lobby_marker_ready' .github/scripts/deploy-testplex-hyperv.sh
          echo "Verified the isolated sandbox marker and delayed test-lobby readiness contract."

      - name: Package all Mineplex map archives for the isolated test server
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/create-testplex-map-bundle.py Plugins/out/testplex-map-assets.zip
          test -s Plugins/out/testplex-map-assets.zip
          unzip -tq Plugins/out/testplex-map-assets.zip >/dev/null
          ls -lh Plugins/out/testplex-map-assets.zip

      - name: Verify deterministic map bundle packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import io
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile

          script = Path(".github/scripts/create-testplex-map-bundle.py")
          spec = importlib.util.spec_from_file_location("testplex_map_bundle", script)
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load the map bundle packaging module.")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with TemporaryDirectory() as temp:
              root = Path(temp)
              maps = root / "maps"
              category = maps / "Lobby"
              category.mkdir(parents=True)
              source = category / "sample.zip"
              source.write_bytes(b"same map archive bytes")
              first = root / "first.zip"
              second = root / "second.zip"

              os.utime(source, (1700000000, 1700000000))
              module.package_maps(maps, first)
              os.utime(source, (1800000000, 1800000000))
              module.package_maps(maps, second)

              if first.read_bytes() != second.read_bytes():
                  raise SystemExit("Map bundle changed when only source file mtimes changed.")
          print("Map bundle packaging is reproducible across checkout mtimes.")

          # MonsterMazeStandalone supplies these seven maps. Testplex needs the original
          # per-map center, entity skin and B1/B2/B3 palette in Mineplex WorldConfig.dat.
          required_maps = {
              "Eye of Ender.zip": ("MAP_NAME:Eye of Ender", "TEAM_NAME:ORANGE", "TEAM_SPAWNS:0,64,0", "DATA_NAME:ORANGE", "DATA_LOCS:0,64,0", "CUSTOM_NAME:E=ENDERMAN", "CUSTOM_NAME:B1=121,0", "CUSTOM_NAME:B2=121,0", "CUSTOM_NAME:B3=121,0"),
              "Volcano.zip": ("MAP_NAME:Volcano", "TEAM_NAME:ORANGE", "TEAM_SPAWNS:-3,114,3", "DATA_NAME:ORANGE", "DATA_LOCS:-3,114,3", "CUSTOM_NAME:E=PIG_ZOMBIE", "CUSTOM_NAME:B1=112,0", "CUSTOM_NAME:B2=87,0", "CUSTOM_NAME:B3=112,0"),
              "Colombia.zip": ("MAP_NAME:Colombia", "TEAM_NAME:ORANGE", "TEAM_SPAWNS:-7,61,5", "DATA_NAME:ORANGE", "DATA_LOCS:-7,61,5", "CUSTOM_NAME:E=OCELOT", "CUSTOM_NAME:B1=2,0", "CUSTOM_NAME:B2=1,2", "CUSTOM_NAME:B3=5,0"),
              "Sandy Coast.zip": ("MAP_NAME:Sandy Coast", "TEAM_NAME:ORANGE", "TEAM_SPAWNS:23,13,15", "DATA_NAME:ORANGE", "DATA_LOCS:23,13,15", "CUSTOM_NAME:E=VILLAGER", "CUSTOM_NAME:B1=155,0", "CUSTOM_NAME:B2=155,2", "CUSTOM_NAME:B3=155,0"),
              "Siberian.zip": ("MAP_NAME:Siberian", "TEAM_NAME:ORANGE", "TEAM_SPAWNS:0,7,0", "DATA_NAME:ORANGE", "DATA_LOCS:0,7,0", "CUSTOM_NAME:E=SNOWMAN", "CUSTOM_NAME:B1=80,0", "CUSTOM_NAME:B2=80,0", "CUSTOM_NAME:B3=80,0"),
              "Swampland.zip": ("MAP_NAME:Swampland", "TEAM_NAME:ORANGE", "TEAM_SPAWNS:0,7,0", "DATA_NAME:ORANGE", "DATA_LOCS:0,7,0", "CUSTOM_NAME:E=ZOMBIE", "CUSTOM_NAME:B1=2,0", "CUSTOM_NAME:B2=3,0", "CUSTOM_NAME:B3=3,0"),
              "Tesoro Hundido.zip": ("MAP_NAME:Tesoro Hundido", "TEAM_NAME:ORANGE", "TEAM_SPAWNS:0,27,0", "DATA_NAME:ORANGE", "DATA_LOCS:0,27,0", "CUSTOM_NAME:E=SQUID", "CUSTOM_NAME:B1=82,0", "CUSTOM_NAME:B2=159,9", "CUSTOM_NAME:B3=35,7"),
          }
          source_map_dir = Path("update/maps/Monster Maze")
          for filename, required_values in required_maps.items():
              source_archive = source_map_dir / filename
              if not source_archive.is_file():
                  raise SystemExit(f"Monster Maze source map is missing: {source_archive}")
              with ZipFile(source_archive) as archive:
                  names = set(archive.namelist())
                  if "WorldConfig.dat" not in names:
                      raise SystemExit(f"{filename} is missing root WorldConfig.dat")
                  if ("session.lock" in names or "WorldDownloader.txt" in names
                          or any(name.startswith(("playerdata/", "stats/", "advancements/")) for name in names)):
                      raise SystemExit(f"{filename} contains transient session/player data")
                  if filename != "Eye of Ender.zip":
                      if "level.dat" not in names:
                          raise SystemExit(f"{filename} is missing its real level.dat")
                      if not any(name.startswith("region/") and name.endswith(".mca") for name in names):
                          raise SystemExit(f"{filename} has no real region MCA data")
                  config = archive.read("WorldConfig.dat").decode("utf-8")
                  missing = [value for value in required_values if value not in config]
                  if missing:
                      raise SystemExit(f"{filename} has incomplete map metadata: {missing}")

          bundle_path = Path("Plugins/out/testplex-map-assets.zip")
          with ZipFile(bundle_path) as bundle:
              bundle_names = set(bundle.namelist())
              for filename in required_maps:
                  member = f"maps/Monster Maze/{filename}"
                  if member not in bundle_names:
                      raise SystemExit(f"Packaged map bundle is missing {member}")
                  with ZipFile(io.BytesIO(bundle.read(member))) as archive:
                      names = set(archive.namelist())
                      if "WorldConfig.dat" not in names:
                          raise SystemExit(f"Packaged map {member} has no WorldConfig.dat")
                      if filename != "Eye of Ender.zip":
                          if "level.dat" not in names or not any(name.startswith("region/") and name.endswith(".mca") for name in names):
                              raise SystemExit(f"Packaged map {member} is missing its real world data")
                      config = archive.read("WorldConfig.dat").decode("utf-8")
                      if "DATA_NAME:ORANGE" not in config or "TEAM_NAME:ORANGE" not in config:
                          raise SystemExit(f"Packaged map {member} has incomplete maze/team metadata")
          print("All seven Monster Maze maps include WorldConfig.dat and are present in the deployable bundle.")
          PY

      - name: Smoke-check native gameplay and cosmetic hooks
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/deploy-testplex-hyperv.sh
          grep -Fq 'ARTIFACT_CACHE="/var/tmp/testplex-artifact-cache"' .github/scripts/deploy-testplex-hyperv.sh
          bash <<'BASH'
          set -euo pipefail
          JAR_ENTRY_RE='^[A-Za-z0-9._+() -]+[.]jar$'
          for entry in "Arcade.jar" "Google Sheets.jar" "Foo (1).jar"; do
            [[ "$entry" =~ $JAR_ENTRY_RE ]] || { echo "Allowed JAR name rejected: $entry" >&2; exit 1; }
          done
          for entry in "../Arcade.jar" "subdir/Arcade.jar" 'bad$.jar'; do
            if [[ "$entry" =~ $JAR_ENTRY_RE ]]; then
