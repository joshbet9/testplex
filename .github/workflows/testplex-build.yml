name: Testplex Java 8 build

on:
  push:
    branches:
      - "**"
    paths:
      - "Plugins/**"
      - ".github/workflows/testplex-build.yml"
  pull_request:
    paths:
      - "Plugins/**"
      - ".github/workflows/testplex-build.yml"
  workflow_dispatch:
    inputs:
      deploy_to_test_server:
        description: Deploy this successful build to the isolated Windows test server
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testplex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mineplex Reborn modules
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: Plugins/pom.xml

      - name: Verify bundled legacy server dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s libs/spigot-1.8.8-1.9-SNAPSHOT.jar
          test -s libs/bungeecord-bootstrap-1.8-SNAPSHOT.jar
          grep -Fq '${mineplex.libs.dir}/spigot-1.8.8-1.9-SNAPSHOT.jar' Plugins/pom.xml
          grep -Fq '${mineplex.libs.dir}/bungeecord-bootstrap-1.8-SNAPSHOT.jar' Plugins/pom.xml

      - name: Build and install all Maven modules
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -f Plugins/pom.xml \
            -Dmineplex.libs.dir="${GITHUB_WORKSPACE}/libs" \
            -DskipTests \
            install

      - name: Verify Arcade artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "Built artifacts:"
          find Plugins/out -maxdepth 1 -type f -name '*.jar' -printf '%f %s bytes\n' | sort
          test -s Plugins/out/Arcade.jar

      - name: Smoke-check native Snake mechanics and Monster Maze pad bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          snake = Path("Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade/game/games/snake/Snake.java").read_text(encoding="utf-8")
          safe_pad = Path("Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade/game/games/monstermaze/SafePad.java").read_text(encoding="utf-8")

          snake_contract = {
              "progressive magma hazard schedule": "FIRST_MAGMA_HAZARD_MS = 45000L",
              "repeating magma hazard schedule": "MAGMA_HAZARD_INTERVAL_MS = 30000L",
              "four-hazard cap": "MAX_MAGMA_HAZARDS = 4",
              "roulette control effect set": "enum ControlDebuff",
              "steering uses roulette result": "getDebuffedDirection(player).multiply(4)",
              "persistent drift heading": "_lastTravelDirection.put(player, blended.clone())",
              "persistent weak-turn heading": "appliedYaw += clamp(remaining, -4.0f, 4.0f)",
              "hazards removed with round cleanup": "removeMagmaCubes();",
          }
          safe_pad_contract = {
              "safe-pad rejects other worlds": "e.getWorld() != _loc.getWorld()",
              "symmetric X bounds": "dx > -2.5 && dx < 2.5",
              "symmetric Z bounds": "dz > -2.5 && dz < 2.5",
              "safe-pad vertical bounds": "dy > 0.0 && dy < 5.0",
          }

          missing = []
          for label, source in snake_contract.items():
              if source not in snake:
                  missing.append("Snake: " + label)
          for label, source in safe_pad_contract.items():
              if source not in safe_pad:
                  missing.append("Monster Maze SafePad: " + label)

          if missing:
              raise SystemExit("Native gameplay smoke checks failed:\n- " + "\n- ".join(missing))
          print("Native Snake and Monster Maze smoke checks passed.")
          PY

      - name: Upload compiled plugin set
        uses: actions/upload-artifact@v4
        with:
          name: testplex-plugin-set-${{ github.sha }}
          path: Plugins/out/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Testplex Arcade build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`testplex-plugin-set-${GITHUB_SHA}\`"
            echo "- Files: all JARs under \`Plugins/out/\`"
            echo "- Validation: full Maven reactor build and non-empty Arcade JAR"
            echo
            echo "This artifact contains the compiled plugin set only, not a runnable server bundle. The server still needs its own runtime files, maps, configuration, Redis/MySQL, and API service."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_test_server:
    name: Deploy to isolated Windows test server
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feat/testbed-bootstrap' && vars.TESTPLEX_AUTO_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_test_server) }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - testplex
    timeout-minutes: 15
    concurrency:
      group: testplex-isolated-test-server
      cancel-in-progress: false
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Download the exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: testplex-plugin-set-${{ github.sha }}
          path: ${{ runner.temp }}\testplex-plugin-set

      - name: Deploy with backup and restart verification
        shell: pwsh
        env:
          TESTPLEX_SERVER_DIR: ${{ vars.TESTPLEX_SERVER_DIR }}
          TESTPLEX_STOP_SCRIPT: ${{ vars.TESTPLEX_STOP_SCRIPT }}
          TESTPLEX_START_SCRIPT: ${{ vars.TESTPLEX_START_SCRIPT }}
          TESTPLEX_PROCESS_MATCH: ${{ vars.TESTPLEX_PROCESS_MATCH }}
          TESTPLEX_ARTIFACT_DIR: ${{ runner.temp }}\testplex-plugin-set
        run: .\.github\scripts\deploy-testplex.ps1
