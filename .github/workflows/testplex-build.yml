          missing = []
          for game, checks in contracts.items():
              source = sources[game]
              for label, expected in checks.items():
                  if expected not in source:
                      missing.append(f"{game}: {label}")

          maze_source = sources["Monster Maze"]
          particle_path_method = maze_source.split("private void updateFirstStageParticlePath()", 1)[1].split("private void playPadSpawnSignal(", 1)[0]
          firework_method = maze_source.split("private void playPadSpawnSignal(", 1)[1].split("private void clearStaleMazeEntities()", 1)[0]
          if "_newPlayerTutorialViewers.contains(viewer.getUniqueId())" not in particle_path_method:
              missing.append("Monster Maze: first-pad particle breadcrumb must be limited to new players")
          if "UtilParticle.PlayParticle(ParticleType.HAPPY_VILLAGER" not in particle_path_method:
              missing.append("Monster Maze: first-pad particle breadcrumb must use viewer-targeted particles")
          if "if (_padSpawnCount >= 2)" not in firework_method or "for (Player viewer : _host.GetPlayers(false))" not in firework_method:
              missing.append("Monster Maze: first two Safe Pad fireworks must be sent to every participant each game")
          if "_newPlayerTutorialViewers" in firework_method or "_newPlayerTutorialViewers.isEmpty()" in firework_method:
              missing.append("Monster Maze: all-player fireworks must not be gated by new-player eligibility")
          theme_lookup = maze_source.split("public String getMobThemeChoiceForPlayer(Player player)", 1)[1].split("public String getMobSetForPlayer(Player player)", 1)[0]
          if 'applyMobThemeChoice(player, "map_default", false)' not in theme_lookup:
              missing.append("Monster Maze: theme lookup must default to Map Default when a player has no round choice")
          if 'getCommand("cosmetics")' in sources["Cosmetic selector"]:
              missing.append("Cosmetic selector: must not replace the normal /cosmetics command")
          if "getBaconBrawlAccessory" in sources["Bacon Brawl"] or "cosmeticAccessories(UpdateEvent event)" in sources["Bacon Brawl"]:
              missing.append("Bacon Brawl: obsolete wearable-accessory cosmetics must be removed")
          if 'Bukkit.dispatchCommand(event.getPlayer(), "cosmetics")' in sources["Game Host Manager"]:
              missing.append("Game Host Manager: the sandbox chest must not dispatch the prototype menu")
          load_files_body = sources["Map Loader"].split("public ArrayList<String> LoadFiles(String gameName)", 1)[1].split("private File resolveMapRoot()", 1)[0]
          if "folder.mkdirs()" in load_files_body:
              missing.append("Map Loader: must not create a missing map folder and silently report zero maps")
          if "Material.JUKEBOX" not in sources["Cosmetic selector"] or 'Bukkit.dispatchCommand(player, "arcadecosmetics")' not in sources["Cosmetic selector"]:
              missing.append("Cosmetic selector: the normal Cosmetics menu must expose the jukebox entry point")
          if missing:
              raise SystemExit("Native gameplay/cosmetic smoke checks failed:\n- " + "\n- ".join(missing))
          print("Native gameplay, 16-game cosmetics, map loading and guarded deployment smoke checks passed.")
          PY

      - name: Upload compiled plugin set
        uses: actions/upload-artifact@v4
        with:
          name: testplex-plugin-set-${{ github.sha }}
          path: |
            Plugins/out/Arcade.jar
            Plugins/out/testplex-map-assets.zip
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Testplex Arcade build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`testplex-plugin-set-${GITHUB_SHA}\`"
            echo "- Files: \`Plugins/out/Arcade.jar\` only"
            echo "- Validation: full Maven reactor build, native gameplay/cosmetic smoke checks, and safe deployment filename tests"
            echo
            echo "This artifact is intentionally Arcade-only for the dedicated test instance; Hub, Clans, StaffServer and other server-mode plugins are not co-installed. It is not a runnable server bundle. The server still needs its own runtime files, maps, configuration, Redis/MySQL, and compatible API/service configuration."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_test_server:
    name: Deploy isolated Reborn test server to Hyper-V
    needs: build
    if: ${{ always() && github.ref == 'refs/heads/feat/testbed-bootstrap' && ((github.event_name == 'push' && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_test_server && (needs.build.result == 'success' || inputs.source_run_id != ''))) }}
    runs-on: ubuntu-22.04
    environment: hyperv
    timeout-minutes: 45
    concurrency:
      group: testplex-isolated-hyperv-server
      cancel-in-progress: true
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect runner to Hyper-V over Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.98.188.97

      - name: Prepare SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HYPERV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HYPERV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'HYPERV_SSH_PRIVATE_KEY is not configured.' >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'HYPERV_SSH_KNOWN_HOSTS is not configured.' >&2; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/testplex_hyperv"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/testplex_hyperv" "$HOME/.ssh/known_hosts"

      - name: Validate isolated Hyper-V target configuration
        shell: bash
        env:
          TESTPLEX_SERVER_DIR: ${{ vars.TESTPLEX_SERVER_DIR }}
          TESTPLEX_SYSTEMD_SERVICE: ${{ vars.TESTPLEX_SYSTEMD_SERVICE }}
        run: |
          set -euo pipefail
          case "$TESTPLEX_SERVER_DIR" in
            /home/monstermaze/servers/testplex|/home/monstermaze/servers/testplex-*) ;;
            *) echo "TESTPLEX_SERVER_DIR must be a dedicated /home/monstermaze/servers/testplex[-name] directory." >&2; exit 1 ;;
          esac
          [[ "$TESTPLEX_SYSTEMD_SERVICE" =~ ^testplex-[A-Za-z0-9_.@-]+\.service$ ]] || {
            echo "TESTPLEX_SYSTEMD_SERVICE must be a testplex-*.service unit." >&2
            exit 1
          }
          [[ "$TESTPLEX_SYSTEMD_SERVICE" != "monstermaze-18.service" && "$TESTPLEX_SYSTEMD_SERVICE" != "monstermaze-21.service" ]]

      - name: Select existing successful build artifact
        id: source-artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "source_run_id must be numeric." >&2; exit 1; }
          run_json="$RUNNER_TEMP/testplex-source-run.json"
          artifacts_json="$RUNNER_TEMP/testplex-source-artifacts.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" -o "$run_json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "feat/testbed-bootstrap" '
            .status == "completed" and .conclusion == "success" and
            .head_branch == $branch and
            ((.head_repository.full_name // "") | ascii_downcase) == ($repo | ascii_downcase) and
            .path == ".github/workflows/testplex-build.yml"
          ' "$run_json" >/dev/null || {
            echo "Source run must be a successful Testplex build from feat/testbed-bootstrap in this repository." >&2
            exit 1
          }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" -o "$artifacts_json"
          artifact_record="$(jq -ce '[.artifacts[] | select(.expired == false and (.name | startswith("testplex-plugin-set-")))] | if length == 1 then .[0] else error("Expected exactly one unexpired testplex-plugin-set artifact") end' "$artifacts_json")"
          artifact_name="$(jq -er '.name' <<< "$artifact_record")"
          artifact_id="$(jq -er '.id | tostring' <<< "$artifact_record")"
          artifact_sha="${artifact_name#testplex-plugin-set-}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "Selected $artifact_name from successful run $SOURCE_RUN_ID"

      - name: Select artifact from this build
        id: current-artifact
        if: ${{ steps.source-artifact.outputs.artifact_id == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifacts_json="$RUNNER_TEMP/testplex-current-artifacts.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -o "$artifacts_json"
          expected_name="testplex-plugin-set-$GITHUB_SHA"
          artifact_record="$(jq -ce --arg expected "$expected_name" '[.artifacts[] | select(.expired == false and .name == $expected)] | if length == 1 then .[0] else error("Expected exactly one current-run plugin artifact") end' "$artifacts_json")"
          artifact_name="$(jq -er '.name' <<< "$artifact_record")"
          artifact_id="$(jq -er '.id | tostring' <<< "$artifact_record")"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Selected current-run artifact $artifact_name"

      - name: Download selected artifact to runner
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source-artifact.outputs.artifact_name || steps.current-artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/testplex-upload-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact over SSH and deploy
        shell: bash
        timeout-minutes: 40
        env:
          BUILD_SHA: ${{ steps.source-artifact.outputs.artifact_sha || steps.current-artifact.outputs.artifact_sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYPERV_SSH_HOST: ${{ secrets.HYPERV_SSH_HOST }}
          HYPERV_SSH_USER: ${{ secrets.HYPERV_SSH_USER }}
          HYPERV_SSH_PORT: ${{ secrets.HYPERV_SSH_PORT }}
          TESTPLEX_SERVER_DIR: ${{ vars.TESTPLEX_SERVER_DIR }}
          TESTPLEX_SYSTEMD_SERVICE: ${{ vars.TESTPLEX_SYSTEMD_SERVICE }}
        run: |
          set -euo pipefail
          # Never let an older queued push roll the shared test service back
          # after a newer branch commit has already been accepted.
          current_branch_json="$RUNNER_TEMP/testplex-current-branch.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/feat/testbed-bootstrap" -o "$current_branch_json"
          current_branch_sha="$(jq -er '.commit.sha' "$current_branch_json")"
          if [[ "$BUILD_SHA" != "$current_branch_sha" ]]; then
            echo "Skipping stale build $BUILD_SHA; current feat/testbed-bootstrap head is $current_branch_sha."
            exit 0
          fi
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing valid build SHA." >&2; exit 1; }
          test -n "$HYPERV_SSH_HOST" || { echo 'HYPERV_SSH_HOST is not configured.' >&2; exit 1; }
          test -n "$HYPERV_SSH_USER" || { echo 'HYPERV_SSH_USER is not configured.' >&2; exit 1; }

          ARTIFACT_DIR="$RUNNER_TEMP/testplex-upload-source"
          test -s "$ARTIFACT_DIR/Arcade.jar" || { echo "Artifact is missing Arcade.jar." >&2; exit 1; }
          test -s "$ARTIFACT_DIR/testplex-map-assets.zip" || { echo "Artifact is missing testplex-map-assets.zip." >&2; exit 1; }
          unzip -tq "$ARTIFACT_DIR/Arcade.jar" >/dev/null
          unzip -tq "$ARTIFACT_DIR/testplex-map-assets.zip" >/dev/null

          port="${HYPERV_SSH_PORT:-22}"
          remote="$HYPERV_SSH_USER@$HYPERV_SSH_HOST"
          upload_dir="/var/tmp/testplex-artifact-cache"
          legacy_upload_dir="/tmp/testplex-artifact-cache"
          deploy_script="/tmp/testplex-deploy-script-$BUILD_SHA.sh"
          ssh_opts=(-p "$port" -i "$HOME/.ssh/testplex_hyperv"
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=30)

          echo "Preflight: checking SSH reachability, sandbox marker and service responsiveness before transfer."
          ssh "${ssh_opts[@]}" "$remote" \
            "set -eu; test -f '$TESTPLEX_SERVER_DIR/.testplex-sandbox'; test -d '$TESTPLEX_SERVER_DIR/plugins'; printf 'Remote host: '; hostname; printf 'Test service state: '; timeout 8 systemctl is-active '$TESTPLEX_SYSTEMD_SERVICE' || true; echo 'Memory:'; free -h; echo 'Disk:'; df -h '$TESTPLEX_SERVER_DIR'; echo 'Disk-backed upload target:'; df -h /var/tmp"

          echo "Preparing the disk-backed artifact cache on the test VM."
          ssh "${ssh_opts[@]}" "$remote" "install -d -m 0700 '$upload_dir'"
          # Ship the guarded deployment helper first so the manifest check can read
          # installed maps as root without changing their restrictive permissions.
          scp -p -P "$port" -i "$HOME/.ssh/testplex_hyperv" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$GITHUB_WORKSPACE/.github/scripts/deploy-testplex-hyperv.sh" "$remote:$deploy_script"

          # The last successful deployment records which source revision the
          # installed map ZIPs represent. Compare source paths to that revision:
          # code-only changes skip the expensive map checksum/transfer path.
          MAPS_MODE="bundle"
          MAP_BASELINE_FALLBACK="628140fd7865acf3eff2b46618aed79cb1f37b32"
          map_baseline="$(ssh "${ssh_opts[@]}" "$remote" "cat /home/monstermaze/update/maps/.testplex-map-source-commit 2>/dev/null || true")"
          if [[ ! "$map_baseline" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$map_baseline^{commit}" 2>/dev/null; then
            map_baseline="$MAP_BASELINE_FALLBACK"
            echo "Map source marker missing/unavailable; bootstrapping from last verified map install $map_baseline."
          fi
          if git cat-file -e "$BUILD_SHA^{commit}" 2>/dev/null && git cat-file -e "$map_baseline^{commit}" 2>/dev/null; then
            if git diff --quiet "$map_baseline" "$BUILD_SHA" -- update/maps/; then
              MAPS_MODE="installed"
              echo "No map-source changes since deployed revision $map_baseline; skipping ZIP scans and bundle transfer."
            else
              echo "Map-source files changed since deployed revision $map_baseline; transferring the new bundle."
            fi
          else
            echo "Cannot compare map-source revisions safely; using the verified bundle."
          fi

          # The host can SSH normally but has repeatedly timed out on a single
          # 20 MiB Arcade.jar SCP stream. Transfer small independently checked
          # chunks instead; the service remains untouched until the complete
          # assembled JAR passes the end-to-end SHA-256 check below.
          echo "Uploading Arcade.jar as verified 4 MiB SCP chunks."
          arcade_local_chunks="$RUNNER_TEMP/testplex-arcade-chunks-$BUILD_SHA"
          arcade_remote_chunks="$upload_dir/arcade-chunks-$BUILD_SHA"
          arcade_partial="$upload_dir/Arcade.jar.partial-$BUILD_SHA"
          mkdir -p "$arcade_local_chunks"
          split -b 4m -d -a 3 "$ARTIFACT_DIR/Arcade.jar" "$arcade_local_chunks/part-"
          ssh "${ssh_opts[@]}" "$remote" \
            "install -d -m 0700 '$arcade_remote_chunks' && rm -f '$arcade_remote_chunks'/part-* '$arcade_remote_chunks'/part-*.partial '$arcade_partial'"

          for chunk in "$arcade_local_chunks"/part-*; do
            chunk_name="$(basename "$chunk")"
            chunk_sha="$(sha256sum "$chunk" | cut -d ' ' -f1)"
            chunk_upload_ok=0
            for attempt in 1 2 3; do
              if scp -p -P "$port" -i "$HOME/.ssh/testplex_hyperv" \
                -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=30 \
                "$chunk" "$remote:$arcade_remote_chunks/$chunk_name.partial"; then
                remote_chunk_sha="$(ssh "${ssh_opts[@]}" "$remote" \
                  "if [[ -s '$arcade_remote_chunks/$chunk_name.partial' ]]; then sha256sum '$arcade_remote_chunks/$chunk_name.partial' | cut -d ' ' -f1; fi" 2>/dev/null || true)"
                if [[ "$chunk_sha" == "$remote_chunk_sha" ]]; then
                  ssh "${ssh_opts[@]}" "$remote" \
                    "mv -f '$arcade_remote_chunks/$chunk_name.partial' '$arcade_remote_chunks/$chunk_name'"
                  chunk_upload_ok=1
                  break
                fi
              fi
              echo "Arcade.jar chunk $chunk_name upload attempt $attempt/3 failed verification." >&2
              if [[ "$attempt" -lt 3 ]]; then sleep 2; fi
            done
            [[ "$chunk_upload_ok" -eq 1 ]] || {
              echo "Could not upload and verify Arcade.jar chunk $chunk_name; the running service has not been touched." >&2
              exit 1
            }
          done

          local_arcade_sha="$(sha256sum "$ARTIFACT_DIR/Arcade.jar" | cut -d ' ' -f1)"
          remote_arcade_sha="$(ssh "${ssh_opts[@]}" "$remote" \
            "cat '$arcade_remote_chunks'/part-* > '$arcade_partial' && sha256sum '$arcade_partial' | cut -d ' ' -f1")"
          [[ "$local_arcade_sha" == "$remote_arcade_sha" ]] || {
            echo "Assembled Arcade.jar checksum mismatch; refusing deployment." >&2
            exit 1
          }
          ssh "${ssh_opts[@]}" "$remote" \
            "mv -f '$arcade_partial' '$upload_dir/Arcade.jar' && rm -rf '$arcade_remote_chunks'"
          rm -rf "$arcade_local_chunks"
          echo "Arcade.jar chunks assembled and verified by SHA-256."

          local_arcade_sha="$(sha256sum "$ARTIFACT_DIR/Arcade.jar" | cut -d ' ' -f1)"
          remote_arcade_sha="$(ssh "${ssh_opts[@]}" "$remote" "sha256sum '$upload_dir/Arcade.jar' | cut -d ' ' -f1")"
          [[ "$local_arcade_sha" == "$remote_arcade_sha" ]] || {
            echo "Arcade.jar checksum mismatch; refusing deployment." >&2
            exit 1
          }
          echo "Arcade.jar verified by SHA-256."

          if [[ "$MAPS_MODE" == "bundle" ]]; then
            local_maps_sha="$(sha256sum "$ARTIFACT_DIR/testplex-map-assets.zip" | cut -d ' ' -f1)"
            remote_maps_sha="$(ssh "${ssh_opts[@]}" "$remote" "if [[ -s '$upload_dir/testplex-map-assets.zip' ]]; then sha256sum '$upload_dir/testplex-map-assets.zip' | cut -d ' ' -f1; else printf missing; fi")"
            if [[ "$local_maps_sha" != "$remote_maps_sha" ]]; then
              map_partial="$upload_dir/testplex-map-assets.zip.partial-$BUILD_SHA"
              echo "Map bundle differs; transferring to a build-specific partial file so failed transfers can resume safely."
              if ssh "${ssh_opts[@]}" "$remote" "command -v rsync >/dev/null 2>&1"; then
                rsync --archive --partial --append-verify --timeout=180 --info=progress2 \
                  -e "ssh -p $port -i $HOME/.ssh/testplex_hyperv -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=30" \
                  "$ARTIFACT_DIR/testplex-map-assets.zip" "$remote:$map_partial"
              else
                scp -p -P "$port" -i "$HOME/.ssh/testplex_hyperv" \
                  -o BatchMode=yes -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                  -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=30 \
                  "$ARTIFACT_DIR/testplex-map-assets.zip" "$remote:$map_partial"
              fi
              remote_partial_sha="$(ssh "${ssh_opts[@]}" "$remote" "sha256sum '$map_partial' | cut -d ' ' -f1")"
              [[ "$local_maps_sha" == "$remote_partial_sha" ]] || {
                echo "Map bundle checksum mismatch after transfer; the existing installed maps and running service are untouched." >&2
                exit 1
              }
              ssh "${ssh_opts[@]}" "$remote" "mv -f '$map_partial' '$upload_dir/testplex-map-assets.zip'"
              echo "Map bundle atomically installed in the artifact cache after SHA-256 verification."
            else
              echo "Cached map bundle already matches the selected artifact."
            fi
          else
            echo "Skipping the large map bundle: installed map ZIPs match the selected build's map source."
          fi

          echo "Removing the legacy cache from /tmp and reporting remaining capacity."
          ssh "${ssh_opts[@]}" "$remote" "rm -rf '$legacy_upload_dir'; rm -f '$upload_dir/testplex-map-manifest-$BUILD_SHA.sha256'; echo 'Remaining /var/tmp and /tmp capacity:'; df -h '$upload_dir'; df -h /tmp"

          echo "Running the checked-out deployment script; the script will verify the sandbox marker, maps and startup."
          ssh "${ssh_opts[@]}" "$remote" \
            "chmod 0644 '$deploy_script' && sudo -n bash '$deploy_script' '$BUILD_SHA' '$TESTPLEX_SERVER_DIR' '$TESTPLEX_SYSTEMD_SERVICE' '$MAPS_MODE'; rc=\$?; rm -f '$deploy_script' '$upload_dir/testplex-map-manifest-$BUILD_SHA.sha256'; exit \$rc"
