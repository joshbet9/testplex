name: Testplex Java 8 build

on:
  push:
    branches:
      - "**"
    paths:
      - "Plugins/**"
      - ".github/workflows/testplex-build.yml"
  pull_request:
    paths:
      - "Plugins/**"
      - ".github/workflows/testplex-build.yml"
  workflow_dispatch:
    inputs:
      deploy_to_test_server:
        description: Deploy this successful build to the isolated Windows test server
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testplex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mineplex Reborn modules
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: Plugins/pom.xml

      - name: Verify bundled legacy server dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s libs/spigot-1.8.8-1.9-SNAPSHOT.jar
          test -s libs/bungeecord-bootstrap-1.8-SNAPSHOT.jar
          grep -Fq '${mineplex.libs.dir}/spigot-1.8.8-1.9-SNAPSHOT.jar' Plugins/pom.xml
          grep -Fq '${mineplex.libs.dir}/bungeecord-bootstrap-1.8-SNAPSHOT.jar' Plugins/pom.xml

      - name: Build and install all Maven modules
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -f Plugins/pom.xml \
            -Dmineplex.libs.dir="${GITHUB_WORKSPACE}/libs" \
            -DskipTests \
            install

      - name: Verify Arcade artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "Built artifacts:"
          find Plugins/out -maxdepth 1 -type f -name '*.jar' -printf '%f %s bytes\n' | sort
          test -s Plugins/out/Arcade.jar

      - name: Smoke-check native gameplay and cosmetic hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          base = Path("Plugins/Nautilus.Game.Arcade/src/nautilus/game/arcade")
          sources = {
              "Snake": (base / "game/games/snake/Snake.java").read_text(encoding="utf-8"),
              "Monster Maze SafePad": (base / "game/games/monstermaze/SafePad.java").read_text(encoding="utf-8"),
              "Monster Maze": (base / "game/games/monstermaze/Maze.java").read_text(encoding="utf-8"),
              "Runner": (base / "game/games/runner/Runner.java").read_text(encoding="utf-8"),
              "Bacon Brawl": (base / "game/games/baconbrawl/BaconBrawl.java").read_text(encoding="utf-8"),
              "Dragon Escape": (base / "game/games/dragonescape/DragonEscape.java").read_text(encoding="utf-8"),
              "Evolution": (base / "game/games/evolution/Evolution.java").read_text(encoding="utf-8"),
              "Micro Battles": (base / "game/games/micro/Micro.java").read_text(encoding="utf-8"),
              "Cosmetic selector": (base / "cosmetics/ArcadeCosmeticsMenu.java").read_text(encoding="utf-8"),
              "Deployment script": Path(".github/scripts/deploy-testplex.ps1").read_text(encoding="utf-8"),
              "Deploy workflow": Path(".github/workflows/testplex-build.yml").read_text(encoding="utf-8"),
              "Deployment guide": Path("docs/testbed-deployment.md").read_text(encoding="utf-8"),
              "In-game test plan": Path("docs/IN-GAME-TEST-PLAN.md").read_text(encoding="utf-8"),
          }

          contracts = {
              "Snake": {
                  "progressive hazard start": "FIRST_MAGMA_HAZARD_MS = 45000L",
                  "repeating hazard interval": "MAGMA_HAZARD_INTERVAL_MS = 30000L",
                  "four-hazard cap": "MAX_MAGMA_HAZARDS = 4",
                  "roulette steering hook": "getDebuffedDirection(player).multiply(4)",
                  "persistent drift": "_lastTravelDirection.put(player, blended.clone())",
                  "persistent sharp-turn state": "appliedYaw += clamp(remaining, -4.0f, 4.0f)",
                  "hazard cleanup": "removeMagmaCubes();",
              },
              "Monster Maze SafePad": {
                  "world check": "e.getWorld() != _loc.getWorld()",
                  "symmetric X bounds": "dx > -2.5 && dx < 2.5",
                  "symmetric Z bounds": "dz > -2.5 && dz < 2.5",
                  "vertical bounds": "dy > 0.0 && dy < 5.0",
                  "repairs only objective beacon": "MapUtil.QuickChangeBlockAt(_loc, Material.BEACON.getId(), (byte) 0)",
                  "optional surface tint": "surface-colour-enabled",
                  "valid dye data range": "configuredColour >= 0 && configuredColour <= 15",
              },
              "Monster Maze": {
                  "persistence opt-in defaults off": 'getBoolean("monstermaze.safe-pad-enhancements.enabled", false)',
                  "pre-round audit timing": "now - _initialSafePadCreatedAt >= 2000L",
                  "active objective repair": "_safePad.restoreObjectiveBeaconIfMissing()",
                  "preview objective repair": "_nextSafePad.restoreObjectiveBeaconIfMissing()",
              },
              "Runner": {
                  "player-specific trail choice": "getEquippedChoice(owner.getUniqueId(), \"runner\")",
                  "custom trail blocks": "_blockColours.put(block, Byte.valueOf(colour))",
              },
              "Bacon Brawl": {
                  "themed sparkle trail": "getEquippedColourData(player.getUniqueId(), \"baconbrawl\")",
              },
              "Dragon Escape": {
                  "coloured running trail": "getEquippedColourData(player.getUniqueId(), \"dragonescape\")",
              },
              "Evolution": {
                  "dragon egg evolution effect": "\"dragon-egg\".equals(ArcadeCosmeticsMenu.getEquippedChoice(player.getUniqueId(), \"evolution\"))",
              },
              "Micro Battles": {
                  "player-specific theme trail": "getEquippedColourData(player.getUniqueId(), \"microbattles\")",
              },
              "Cosmetic selector": {
                  "persistent per-player storage": "cosmetics.yml",
                  "shared colour resolver": "getEquippedColourData(UUID playerId, String game)",
              },
              "Deployment script": {
                  "test-only marker required": ".testplex-sandbox",
                  "exact sandbox marker": "TESTPLEX ISOLATED TEST SERVER - NOT PRODUCTION",
                  "versioned backups": ".testplex-backups",
                  "checks server stop/start": "Wait-ForServerProcessState",
                  "rollback remains reachable on failure": 'Write-Warning "Deployment failed: $deploymentError"',
                  "requires Arcade JAR": 'Name -ieq "Arcade.jar"',
              },
              "Deploy workflow": {
                  "test branch guard": "github.ref == 'refs/heads/feat/testbed-bootstrap'",
                  "manual opt-in": "inputs.deploy_to_test_server",
                  "auto-deploy opt-in": "vars.TESTPLEX_AUTO_DEPLOY == 'true'",
                  "dedicated runner label": "- testplex",
              },
              "Deployment guide": {
                  "manual setup guide": "One-time Windows test-server setup",
                  "test-only warning": "Do not point this at a production server.",
                  "safe-pad toggle documented": "monstermaze.safe-pad-enhancements",
              },
              "In-game test plan": {
                  "manual runtime testing disclosed": "these scenarios still require an actual 1.8.x server",
                  "Snake hazard schedule": "135 seconds",
              },
          }

          missing = []
          for game, checks in contracts.items():
              source = sources[game]
              for label, expected in checks.items():
                  if expected not in source:
                      missing.append(f"{game}: {label}")

          if missing:
              raise SystemExit("Native gameplay/cosmetic smoke checks failed:\\n- " + "\\n- ".join(missing))
          print("Native gameplay, six-game cosmetics and guarded deployment smoke checks passed.")
          PY

      - name: Upload compiled plugin set
        uses: actions/upload-artifact@v4
        with:
          name: testplex-plugin-set-${{ github.sha }}
          path: Plugins/out/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Testplex Arcade build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`testplex-plugin-set-${GITHUB_SHA}\`"
            echo "- Files: all JARs under \`Plugins/out/\`"
            echo "- Validation: full Maven reactor build and non-empty Arcade JAR"
            echo
            echo "This artifact contains the compiled plugin set only, not a runnable server bundle. The server still needs its own runtime files, maps, configuration, Redis/MySQL, and API service."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_test_server:
    name: Deploy to isolated Windows test server
    needs: build
    if: ${{ github.ref == 'refs/heads/feat/testbed-bootstrap' && ((github.event_name == 'push' && vars.TESTPLEX_AUTO_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_test_server)) }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - testplex
    timeout-minutes: 15
    concurrency:
      group: testplex-isolated-test-server
      cancel-in-progress: false
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Download the exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: testplex-plugin-set-${{ github.sha }}
          path: ${{ runner.temp }}\testplex-plugin-set

      - name: Deploy with backup and restart verification
        shell: pwsh
        env:
          TESTPLEX_SERVER_DIR: ${{ vars.TESTPLEX_SERVER_DIR }}
          TESTPLEX_STOP_SCRIPT: ${{ vars.TESTPLEX_STOP_SCRIPT }}
          TESTPLEX_START_SCRIPT: ${{ vars.TESTPLEX_START_SCRIPT }}
          TESTPLEX_PROCESS_MATCH: ${{ vars.TESTPLEX_PROCESS_MATCH }}
          TESTPLEX_ARTIFACT_DIR: ${{ runner.temp }}\testplex-plugin-set
        run: .\.github\scripts\deploy-testplex.ps1
