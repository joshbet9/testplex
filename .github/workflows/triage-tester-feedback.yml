name: Triage Testplex tester feedback

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: >
      github.event.issue.state == 'open' &&
      (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
      (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot') &&
      (startsWith(github.event.issue.title, '[Bug]') || startsWith(github.event.issue.title, '[Idea]'))
    runs-on: ubuntu-latest
    steps:
      - name: Load game tracker directory
        uses: actions/checkout@v4
      - name: Label and assign tester feedback
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const title = context.payload.issue.title || "";
            const kind = /^\[Bug\]/i.test(title) ? "bug" : /^\[Idea\]/i.test(title) ? "idea" : null;
            if (!kind) return;
            const gameAnswer = body.match(/^### Game\s*\r?\n+([^\r\n]+)/m)?.[1]?.trim();
            const selectedGame = !gameAnswer || gameAnswer === "_No response_" || gameAnswer === "Skip / not sure"
              ? "Shared lobby or global"
              : gameAnswer;
            const trackers = require(`${process.env.GITHUB_WORKSPACE}/docs/tester-feedback-trackers.json`);
            const tracker = trackers.games[selectedGame] || trackers.games["Shared lobby or global"];
            if (!tracker) throw new Error(`No feedback tracker is configured for '${selectedGame || "(missing game)"}'.`);
            const labels = [
              { name: "tester-feedback", color: "1d76db", description: "Feedback submitted from Testplex testers" },
              { name: `tester-${kind}`, color: kind === "bug" ? "d73a4a" : "a2eeef", description: `Testplex tester ${kind}` },
              { name: `game:${tracker.slug}`, color: "5319e7", description: `Testplex feedback for ${tracker.name}` },
            ];
            const trackerLabel = { name: "game-tracker", color: "5319e7", description: "Parent issue that groups feedback for a game" };
            const lifecycleLabels = [
              { name: "submitted", color: "d9eaf7", description: "A new tester report awaiting work." },
              { name: "in-progress", color: "1d76db", description: "Implementation is in progress" },
              { name: "waiting-tester", color: "c5def5", description: "A tester needs to clarify or verify this report." },
              { name: "resolved", color: "0e8a16", description: "Fix is ready and confirmed by the reporter." },
              { name: "deployed", color: "5319e7", description: "Fix or approved change has been deployed." },
            ];
            const existing = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })).map(label => label.name));
            for (const label of [...labels, trackerLabel, ...lifecycleLabels]) {
              if (!existing.has(label.name)) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ...label,
                  });
                } catch (error) {
                  const alreadyCreated = error.status === 422 &&
                    error.response?.data?.errors?.some(
                      entry => entry.code === "already_exists" && entry.field === "name"
                    );
                  if (!alreadyCreated) throw error;
                }
                existing.add(label.name);
              }
              if (label.name !== "game-tracker" && !lifecycleLabels.some(status => status.name === label.name)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: [label.name],
                });
              }
            }
            const lifecycleNames = lifecycleLabels.map(label => label.name);
            const currentIssueLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const currentNames = new Set(currentIssueLabels.map(label => label.name));
            const legacyStatusMap = new Map([
              ["needs-tester-check", "waiting-tester"],
              ["needs-triage", "submitted"],
            ]);
            const lifecyclePrecedence = ["deployed", "resolved", "waiting-tester", "in-progress", "submitted"];
            let desiredStatus = context.payload.action === "opened" || context.payload.action === "reopened"
              ? "submitted"
              : lifecyclePrecedence.find(name => currentNames.has(name));
            if (!desiredStatus) {
              desiredStatus = [...legacyStatusMap].find(([legacy]) => currentNames.has(legacy))?.[1] || "submitted";
            }
            for (const name of [...currentNames]) {
              if ((lifecycleNames.includes(name) || legacyStatusMap.has(name)) && name !== desiredStatus) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              }
            }
            if (!currentNames.has(desiredStatus)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [desiredStatus],
              });
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ["joshbet9"],
            });
            const parent = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: tracker.issue_number,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: tracker.issue_number,
              labels: [`game:${tracker.slug}`, "game-tracker"],
            });
            const existingChildren = await github.request(
              "GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues",
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: tracker.issue_number, per_page: 100 }
            );
            const childId = context.payload.issue.id;
            if (!existingChildren.data.some(issue => issue.id === childId)) {
              await github.request(
                "POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracker.issue_number,
                  sub_issue_id: childId,
                  headers: { "X-GitHub-Api-Version": "2022-11-28" },
                }
              );
            }
            if (context.payload.action === "opened") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Thanks — this ${kind} report is filed under [${tracker.name} #${tracker.issue_number}](${parent.data.html_url}) and assigned for triage. We’ll update this issue as it is reproduced and worked on.`,
              });
            }
            core.notice(`Routed public Testplex ${kind} feedback for ${tracker.name} to its game tracker and joshbet9.`);
