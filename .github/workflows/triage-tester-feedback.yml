name: Triage Testplex tester feedback

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  triage:
    if: contains(github.event.issue.body, 'testplex-feedback:type=')
    runs-on: ubuntu-latest
    steps:
      - name: Label and assign tester feedback
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const kind = body.includes("testplex-feedback:type=bug") ? "bug" : "idea";
            const labels = [
              { name: "tester-feedback", color: "1d76db", description: "Feedback submitted from Testplex testers" },
              { name: `tester-${kind}`, color: kind === "bug" ? "d73a4a" : "a2eeef", description: `Testplex tester ${kind}` },
              { name: "needs-triage", color: "fbca04", description: "Needs reproduction and triage" },
            ];
            const existing = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })).map(label => label.name));
            for (const label of labels) {
              if (!existing.has(label.name)) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label.name],
              });
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ["joshbet9"],
            });
            core.notice(`Routed public Testplex ${kind} feedback to joshbet9 for triage.`);
