name: Codex tester feedback event

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: codex-feedback-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.state == 'open' &&
      (startsWith(github.event.issue.title, '[Bug]') || startsWith(github.event.issue.title, '[Idea]')) &&
      (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      ready: ${{ steps.package.outputs.ready }}
      has_changes: ${{ steps.package.outputs.has_changes }}
    steps:
      - name: Check out the current default branch without a persisted token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Load the complete current issue discussion
        uses: actions/github-script@v7
        env:
          FEEDBACK_FILE: .codex/feedback-event.md
        with:
          script: |
            const fs = require("node:fs");
            const issue = context.payload.issue;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const labels = (issue.labels || []).map(label =>
              typeof label === "string" ? label : label.name
            );
            const discussion = comments.map(comment =>
              [
                `### Comment ${comment.id} by @${comment.user?.login || "unknown"} at ${comment.created_at}`,
                comment.body || "(empty)",
              ].join("\n")
            ).join("\n\n");
            const report = [
              "# Current Testplex feedback event",
              "",
              `Repository: ${context.repo.owner}/${context.repo.repo}`,
              `Issue: #${issue.number} — ${issue.title}`,
              `URL: ${issue.html_url}`,
              `Event: ${context.eventName} / ${context.payload.action}`,
              `Triggered by: @${context.actor}`,
              `Issue state: ${issue.state}`,
              `Labels: ${labels.join(", ") || "(none)"}`,
              "",
              "## Current issue body",
              "",
              issue.body || "(no body)",
              "",
              "## Full issue discussion, oldest first",
              "",
              discussion || "(no comments)",
            ].join("\n");
            fs.mkdirSync(".codex", { recursive: true });
            fs.writeFileSync(process.env.FEEDBACK_FILE, report, { encoding: "utf8", mode: 0o600 });

      - name: Run Codex investigation and focused implementation
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .codex/tester-feedback-prompt.md
          output-file: .codex/feedback-result.md
        env:
          FEEDBACK_EVENT_FILE: .codex/feedback-event.md
        # This job has read-only GitHub permissions and no deployment credential.

      - name: Package summary and reviewable patch
        id: package
        if: steps.codex.outputs.final-message != ''
        env:
          CODEX_MESSAGE: ${{ steps.codex.outputs.final-message }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .codex/feedback-event.md .codex/feedback-result.md
          rm -rf .codex-transfer
          mkdir -p .codex-transfer
          printf '%s' "$CODEX_MESSAGE" > .codex-transfer/summary.md

          git add -N -A
          mapfile -t paths < <(git diff --name-only)
          if (( ${#paths[@]} == 0 )); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for path in "${paths[@]}"; do
            case "$path" in
              .github/*|.codex/*|AGENTS.md|SECURITY.md)
                echo "Codex changed a protected automation/instruction path: $path" >&2
                exit 1
                ;;
            esac
          done

          git diff --check
          git diff --binary > .codex-transfer/changes.patch
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Transfer summary and patch to the publisher job
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-feedback-${{ github.event.issue.number }}-${{ github.run_id }}
          path: .codex-transfer/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the current default branch without a persisted token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: codex-feedback-${{ github.event.issue.number }}-${{ github.run_id }}
          path: .codex-transfer

      - name: Create a draft PR from the reviewed patch
        id: create_pr
        if: needs.review.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "CODEX_GITHUB_TOKEN is required to publish a draft PR and trigger its CI." >&2
            exit 1
          fi

          git apply --check .codex-transfer/changes.patch
          git apply --index .codex-transfer/changes.patch
          mapfile -t paths < <(git diff --cached --name-only)
          if (( ${#paths[@]} == 0 )); then
            echo "Patch contained no changes." >&2
            exit 1
          fi
          for path in "${paths[@]}"; do
            case "$path" in
              .github/*|.codex/*|AGENTS.md|SECURITY.md)
                echo "Refusing to publish a protected path: $path" >&2
                exit 1
                ;;
            esac
          done
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="codex/feedback-${ISSUE_NUMBER}-${RUN_ID}"
          git checkout -b "$branch"
          git commit -m "Prepare feedback fix for #${ISSUE_NUMBER}"
          gh auth setup-git
          git push --set-upstream origin "$branch"

          title="$(printf '%s' "$ISSUE_TITLE" | tr '\r\n' ' ' | cut -c1-140)"
          summary="$(cat .codex-transfer/summary.md)"
          pr_url="$(gh pr create --draft --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "[Codex] ${title}" \
            --body "$(printf 'Automated draft prepared from tester feedback.\n\nRefs #%s\n\nThis change requires maintainer review and successful CI. It has not been merged or deployed.\n\n<details><summary>Codex investigation summary</summary>\n\n%s\n\n</details>' "$ISSUE_NUMBER" "$summary")")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Update issue status and post Codex findings
        if: always()
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        with:
          script: |
            const fs = require("node:fs");
            const raw = fs.readFileSync(".codex-transfer/summary.md", "utf8");
            const marker = raw.match(/^TESTPLEX_STATUS=(submitted|in-progress|waiting-tester)\\s*$/m);
            const pr = process.env.PR_URL || "";
            const desired = pr ? "in-progress" : (marker?.[1] || "submitted");
            const body = raw.replace(/^TESTPLEX_STATUS=(submitted|in-progress|waiting-tester)\\s*\\r?\\n?/m, "").trim();
            const lifecycle = new Set([
              "submitted", "in-progress", "waiting-tester", "resolved", "deployed",
              "needs-triage", "needs-tester-check", "accepted",
            ]);
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const present = new Set(current.map(label => label.name));
            if (!present.has(desired)) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: desired,
                  color: desired === "in-progress" ? "1d76db" : desired === "waiting-tester" ? "c5def5" : "d9eaf7",
                  description: "Testplex feedback lifecycle status",
                });
              } catch (error) {
                const alreadyExists = error.status === 422 &&
                  error.response?.data?.errors?.some(entry => entry.code === "already_exists");
                if (!alreadyExists) throw error;
              }
            }
            for (const label of current) {
              if (lifecycle.has(label.name) && label.name !== desired) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name,
                });
              }
            }
            if (!present.has(desired)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [desired],
              });
            }
            const suffix = pr
              ? `\n\nDraft implementation PR: ${pr}. It is not merged or deployed.`
              : "";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Codex feedback review\n\n${body}${suffix}`,
            });

  report-failure:
    needs: [review, publish]
    if: always() && (needs.review.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report failed automation run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `The automated review run failed before it completed. No fix or deployment is being claimed. Please check this [Actions run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the failure details.`,
            });
