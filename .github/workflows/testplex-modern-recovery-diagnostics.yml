name: Diagnose Testplex Modern recovery state

on:
  push:
    branches:
      - feat/testplex-modern-26.3-platform
    paths:
      - ".github/workflows/testplex-modern-recovery-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

# Share the same Hyper-V serialization group as the modern and Reborn deploys.
# This audit is read-only and must not overlap a deployment transaction.
concurrency:
  group: testplex-isolated-hyperv-server-v2-20261031
  cancel-in-progress: false

jobs:
  inspect-modern-recovery:
    name: Read-only audit of the unresolved modern deployment
    runs-on: ubuntu-22.04
    environment: hyperv
    timeout-minutes: 12
    steps:
      - name: Connect runner to Hyper-V over Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Prepare strict SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HYPERV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HYPERV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "HYPERV_SSH_PRIVATE_KEY is not configured." >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "HYPERV_SSH_KNOWN_HOSTS is not configured." >&2; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"
          printf '%s\\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/testplex_hyperv"
          printf '%s\\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/testplex_hyperv" "$HOME/.ssh/known_hosts"

      - name: Inspect journal, all retained snapshots and modern runtime without changing server state
        shell: bash
        env:
          HYPERV_SSH_HOST: ${{ secrets.HYPERV_SSH_HOST }}
          HYPERV_SSH_USER: ${{ secrets.HYPERV_SSH_USER }}
          HYPERV_SSH_PORT: ${{ secrets.HYPERV_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$HYPERV_SSH_HOST" || { echo "HYPERV_SSH_HOST is not configured." >&2; exit 1; }
          test -n "$HYPERV_SSH_USER" || { echo "HYPERV_SSH_USER is not configured." >&2; exit 1; }
          SSH_PORT="${HYPERV_SSH_PORT:-22}"
          remote="$HYPERV_SSH_USER@$HYPERV_SSH_HOST"
          ssh_opts=(-p "$SSH_PORT" -i "$HOME/.ssh/testplex_hyperv"
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=4)

          timeout --foreground --signal=TERM --kill-after=15s 9m ssh "${ssh_opts[@]}" "$remote" bash -s <<'REMOTE_AUDIT'
          set -uo pipefail
          STATE_DIR=/var/lib/testplex-modern-deploy
          SERVER_DIR=/home/monstermaze/servers/testplex-modern
          MANIFEST="$STATE_DIR/current.properties"

          run_bounded() {
            local seconds="$1"; shift
            timeout --foreground --signal=TERM "${seconds}s" "$@" 2>&1 || true
          }

          echo "=== Audit identity ==="
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          echo "Read-only audit; no artifact, journal, service or configuration changes will be made."

          echo "=== Host capacity ==="
          run_bounded 8 free -h
          run_bounded 8 df -h / /var/tmp
          run_bounded 8 df -i / /var/tmp

          echo "=== Modern transaction journal ==="
          if sudo -n test -f "$MANIFEST"; then
            sudo -n sed -n '1,100p' "$MANIFEST"
            BACKUP_DIR="$(sudo -n sed -n 's/^backup_dir=//p' "$MANIFEST" | head -n 1)"
          else
            echo "No current transaction manifest exists."
            BACKUP_DIR=""
          fi

          if [[ -n "$BACKUP_DIR" && "$BACKUP_DIR" == "$STATE_DIR"/backups/* ]]; then
            echo "=== Current transaction backup metadata ==="
            for file in server-artifacts.tar server-artifacts.sha256 unit.tar unit.sha256 transaction.properties recovery-attempts; do
              if sudo -n test -e "$BACKUP_DIR/$file"; then
                sudo -n stat -c '%n | size=%s | mode=%a | owner=%U:%G | modified=%y' "$BACKUP_DIR/$file"
              else
                echo "MISSING: $BACKUP_DIR/$file"
              fi
            done
            if sudo -n test -s "$BACKUP_DIR/server-artifacts.sha256"; then
              echo "Snapshot checksum:"
              sudo -n sha256sum -c "$BACKUP_DIR/server-artifacts.sha256" 2>&1 || true
            fi
            if sudo -n test -s "$BACKUP_DIR/server-artifacts.tar"; then
              echo "Snapshot member list (first 160 entries):"
              sudo -n tar -tf "$BACKUP_DIR/server-artifacts.tar" 2>&1 | sed -n '1,160p'
              echo "Required top-level members:"
              for member in paper.jar plugins .testplex-modern-deployed-build server.properties; do
                if sudo -n tar -tf "$BACKUP_DIR/server-artifacts.tar" 2>/dev/null | grep -Eq "^(\\./)?${member//./\\.}/?$"; then
                  echo "PRESENT: $member"
                else
                  echo "MISSING: $member"
                fi
              done
            fi
          else
            echo "The journal backup_dir is absent or outside the expected backups directory."
          fi

          echo "=== All retained backup transaction summaries ==="
          if sudo -n test -d "$STATE_DIR/backups"; then
            while IFS= read -r transaction; do
              [[ -n "$transaction" ]] || continue
              echo "--- $transaction ---"
              sudo -n grep -E '^(deployment_id|target_sha|previous_sha|previous_state|status|backup_dir|backup_complete|replacement_started|prior_files|had_old_paper|had_old_plugins)=' "$transaction" 2>/dev/null || true
              backup_dir="${transaction%/transaction.properties}"
              archive="$backup_dir/server-artifacts.tar"
              if sudo -n test -s "$archive"; then
                if sudo -n test -s "$backup_dir/server-artifacts.sha256"; then
                  sudo -n sha256sum -c "$backup_dir/server-artifacts.sha256" 2>&1 || true
                fi
                sudo -n tar -tf "$archive" 2>/dev/null | grep -E '(^|/)(paper\\.jar|plugins/?|\\.testplex-modern-deployed-build)$' | sed -n '1,30p' || true
              else
                echo "No server-artifacts.tar in $backup_dir"
              fi
            done < <(sudo -n find "$STATE_DIR/backups" -mindepth 2 -maxdepth 2 -type f -name transaction.properties -print 2>/dev/null | sort)
          else
            echo "No backups directory exists."
          fi

          echo "=== Current modern server artifacts (metadata only) ==="
          if sudo -n test -d "$SERVER_DIR"; then
            sudo -n find "$SERVER_DIR" -maxdepth 2 -type f \\( -name 'paper.jar' -o -name '*.jar' -o -name '.testplex-modern-deployed-build' -o -name '.testplex-paper-build' -o -name '.testplex-modern-sandbox' \\) -printf '%P | size=%s | modified=%TY-%Tm-%TdT%TH:%TM:%TS\\n' 2>/dev/null | sort | sed -n '1,100p'
            for file in "$SERVER_DIR/paper.jar" "$SERVER_DIR/.testplex-modern-deployed-build" "$SERVER_DIR/plugins/TestplexModernArcade.jar" "$SERVER_DIR/plugins/ArcadeMechanicsModern.jar" "$SERVER_DIR/plugins/SnakeModern.jar" "$SERVER_DIR/plugins/WizardsModern.jar"; do
              if sudo -n test -s "$file"; then
                sudo -n sha256sum "$file"
              fi
            done
          else
            echo "Modern server directory does not exist."
          fi

          echo "=== Modern service and port state ==="
          run_bounded 10 sudo -n systemctl show testplex-modern.service --property=LoadState,ActiveState,SubState,Result,MainPID,InvocationID,ExecMainStatus,NRestarts,ExecStart,WorkingDirectory
          run_bounded 10 sudo -n systemctl is-active testplex-modern.service
          run_bounded 10 sudo -n systemctl is-enabled testplex-modern.service
          run_bounded 10 sudo -n systemctl show testplex-reborn.service --property=ActiveState,SubState,MainPID,Result
          run_bounded 10 sudo -n ss -ltn
          echo "=== Recent modern service errors (credentials redacted) ==="
          run_bounded 12 sudo -n journalctl -u testplex-modern.service -n 160 --no-pager -o short-iso |
            grep -i -E 'error|severe|exception|caused by|failed|out of memory|oom|killed|timeout|paper|arcade' |
            sed -E 's/(bearer[[:space:]]+)[^[:space:]]+/\\1[REDACTED]/Ig; s/((token|password|secret)[=:])[A-Za-z0-9_+\\/=.-]+/\\1[REDACTED]/Ig' |
            tail -n 100 || true
          echo "=== Kernel OOM indicators ==="
          run_bounded 10 sudo -n dmesg -T 2>/dev/null |
            grep -i -E 'out of memory|oom|killed process|java' | tail -n 40 || true
          echo "=== Audit finished; no server state was changed ==="
          REMOTE_AUDIT
