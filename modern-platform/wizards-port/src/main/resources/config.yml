# Standalone Wizards acceptance test defaults. No resource pack is downloaded or required.
test-mode: true
arena-world: wizards_arena
arena-radius: 48
chest-count: 32
allow-solo-start: true
minimum-players: 2
kits:
  default: MAGE
# Implode can remove nearby non-container blocks when enabled. Off by default for reusable test arenas.
destructive-spells: false
# Napalm's temporary fire blocks are restored automatically.
temporary-spell-fire: true
# Endgame hits players, but terrain removal is disabled by default for reusable test arenas.
destructive-endgame-blocks: false
