name: MonsterMazeModern
version: 0.1.0-SNAPSHOT
main: me.monstermaze.MonsterMazePlugin
api-version: '26.3'
author: Testplex
description: Monster Maze gameplay port for the isolated Paper 26.3 Arcade test platform
softdepend:
  - ProtocolLib
  - TestplexModernArcade
commands:
  games:
    aliases: [gameselect, gamemenu]
    description: Open the modern Arcade Game Panel
    usage: /games
  mm:
    description: Monster Maze commands
    usage: /mm <start|stop|setcenter|status|kit|kits|pb|lb|challenge>
  pause:
    description: Pause or resume the current Monster Maze round
    usage: /pause
permissions:
  monstermaze.admin:
    description: Allows control of Monster Maze
    default: op
