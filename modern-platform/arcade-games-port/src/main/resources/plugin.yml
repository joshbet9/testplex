name: ArcadeMechanicsModern
version: 0.1.0-SNAPSHOT
main: au.com.testplex.arcadeports.ArcadeMechanicsModernPlugin
api-version: '26.3'
author: Testplex
description: Controlled Arcade game implementations for Paper 26.3
softdepend:
  - TestplexModernArcade
  - packetevents
  - FakePlayerPlugin
commands:
  stats:
    description: Open local Testplex Arcade statistics or Plexball career progression.
    usage: /stats [plexball]
    aliases: [arcadestats]
  arcadeport:
    description: Start and test a modern Arcade game
    usage: /arcadeport <play|join|leave|spectate|start|kit|stats|ghost|maps|lobby|bot|status|stop>
  mm:
    description: Monster Maze game commands managed by Testplex Arcade
    usage: /mm <start|stop|kit|kits|map|mode|pattern|stats|pb|lb|status>
  pause:
    description: Pause or resume the active Monster Maze round
    usage: /pause
permissions:
  testplex.arcadeports.admin:
    description: Allows stopping and resetting an Arcade prototype
    default: op
