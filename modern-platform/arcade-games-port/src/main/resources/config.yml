# The Arcade catalogue and controlled test queue grow as source-faithful games are promoted.
# READY_FOR_TEST games are available together for the shared controlled test session.
# The 31-ID enabled queue includes Wizards, Hoops Remastered and Heroes of Gwen.
# Evolution remains catalogued but disabled pending its separate source-map clearance.
enabled-games:
  - death-tag
  - one-in-the-quiver
  - bomb-lobbers
  - bacon-brawl
  - castle-assault
  - gladiators
  - micro-battles
  - milk-the-cow
  - paintball
  - plexball
  - spleef
  - super-sploor
  - dragon-escape
  - dragons
  - runner
  - sheep-quest
  - turf-wars
  - camera-shy
  - monster-maze
  - monster-maze-speed
  - monster-maze-modern
  - snake
  - draw-my-thing
  - master-builders
  - skywars
  - wither-assault
  - sneaky-assassins
  - speed-builders
  - heroes-of-gwen
  - hoops-remastered
  - wizards
lobby-selected-game: death-tag
source-maps:
  directory: update/maps
wizards:
  include-nano-maps: true
  minimum-players: 2
  maximum-players: 16
  allow-solo-start: false
  allow-generated-test-arena: false
  source-map-world: arcadeport_source_wizards
  arena-radius: 48
  chest-count: 32
  destructive-spells: false
  destructive-endgame-blocks: false
  temporary-spell-fire: true
  kits:
    default: WIZARD

# Base selection weights used by the Like/Dislike preference calculation.
# Games default to 1.0 (equal base chance); set a game ID here to override it.
# The final displayed likelihood is each adjusted weight divided by the sum of all adjusted weights.
game-preferences:
  base-weights: {}
  automatic-rotation:
    # Disabled by default so the controlled acceptance queue remains operator-driven. Speed Builders is joined with /arcadeport play speed-builders, not automatic rotation.
    enabled: false
    # Match the original Mixed Arcade threshold and vote window when enabled.
    minimum-players: 6
    vote-seconds: 60
    avoid-consecutive-games: true
    # This may be narrowed by Game Panel > Edit Game Rotation, but cannot
    # include a game outside enabled-games or without its selected map asset available.
    enabled-games:
      - death-tag
      - one-in-the-quiver
      - bomb-lobbers

# Optional UUID-to-rank overrides for the Arcade tab list.
# Valid values: owner, admin, mod, helper, ultra, player.
# If no UUID override is present, owner-usernames/admin-usernames and rank permissions are used.
lobby-scoreboard:
  ranks: {}

# Hide individual entries from the shared lobby kit stations without deleting
# their gameplay implementations. Each entry uses "game-id:kit-id", matching
# the legacy KitAvailability.Hide behavior. Empty by default.
lobby-kits:
  # Entries use "game-id:kit-id". Empty by default.
  hidden: []
  # Optional ordered IDs per game. Unlisted visible kits follow their catalogue order.
  # Example:
  # order:
  #   bomb-lobbers: [jumper, armorer, pitcher, waller]
  order: {}

# The named sandbox owner has direct test-harness access even if OP permissions are stale.
owner-usernames:
  - jn_playzmc

# Named accounts allowed operator access on this isolated modern test server.
admin-usernames:
  - jn_playzmc

