# The 24 shared Arcade catalogue entries are packaged in ArcadeMechanicsModern.jar.
# Only games formally marked READY_FOR_TEST may be started in the isolated server.
# The other 22 catalogue entries remain disabled until their parity/acceptance gate is cleared.
enabled-games:
  - death-tag
  - one-in-the-quiver
lobby-selected-game: death-tag

# The named sandbox owner has direct test-harness access even if OP permissions are stale.
owner-usernames:
  - jn_playzmc

# Named accounts allowed operator access on this isolated modern test server.
admin-usernames:
  - jn_playzmc

# Experimental Wizards module. This configuration is nested so the game remains
# owned by ArcadeMechanicsModern and cannot create a second independent game server.
wizards:
  arena-world: testplex_wizards_arena
  source-map-world: arcadeport_source_wizards
  arena-radius: 48
  chest-count: 32
  allow-solo-start: true
  minimum-players: 2
  kits:
    default: MAGE
  destructive-spells: false
  temporary-spell-fire: true
  destructive-endgame-blocks: false
